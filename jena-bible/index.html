<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>橄欖栽子家學堂</title>
<meta name="description" content="耶拿教育（Jenaplan）結合聖經自學的混齡家庭教材：圓圈對話、主題工作、遊戲、慶典，支援電子白板與平板，從特殊需求孩子到小學六年級。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="家學堂">
<meta name="theme-color" content="#4E6B2F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：橄欖綠的家庭教室。四種基本活動各有顏色：對話藍、遊戲橘、工作綠、慶典紫 */
:root{
  --bg:#F3F1E7; --card:#FFFFFF; --ink:#26301E; --muted:#66705A; --line:#DCD9C6; --soft:#ECE9DA;
  --olive:#4E6B2F; --olive-soft:#E3EBD3; --star:#E0A100; --ok:#2F8F5E; --ok-soft:#D6EEDF; --no:#C2553A; --hint:#FFF1C9; --hint-ink:#6A4B00;
  --k-talk:#2F7DB5; --k-play:#D97B12; --k-work:#3E8E5E; --k-party:#8E5BB5; --k-life:#7D8590;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --navh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171B12; --card:#20261A; --ink:#E8EEDD; --muted:#A9B39A; --line:#36402B; --soft:#283020;
  --olive:#A6C77A; --olive-soft:#2E3A21; --star:#F5C431; --ok:#6CCB98; --ok-soft:#1F3A2B; --no:#E98A73; --hint:#3A3015; --hint-ink:#F4DE9C;
  --k-talk:#6FB3E6; --k-play:#F0A24A; --k-work:#6CC08F; --k-party:#C29BE6; --k-life:#A3AAB4;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171B12; --card:#20261A; --ink:#E8EEDD; --muted:#A9B39A; --line:#36402B; --soft:#283020;
  --olive:#A6C77A; --olive-soft:#2E3A21; --star:#F5C431; --ok:#6CCB98; --ok-soft:#1F3A2B; --no:#E98A73; --hint:#3A3015; --hint-ink:#F4DE9C;
  --k-talk:#6FB3E6; --k-play:#F0A24A; --k-work:#6CC08F; --k-party:#C29BE6; --k-life:#A3AAB4;
  color-scheme:dark;
}
html.big{font-size:20px}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1rem;line-height:1.6;-webkit-tap-highlight-color:transparent;min-height:100vh}
[hidden]{display:none!important}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;min-height:44px;touch-action:manipulation}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--star);outline-offset:2px}
button.pri{background:var(--olive);border-color:var(--olive);color:#fff;font-weight:700}
:root:not([data-theme="light"]) button.pri{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.pri{color:#162008}}
:root[data-theme="dark"] button.pri{color:#162008}
a{color:var(--olive)}
.em{font-family:var(--f-emoji);line-height:1;font-style:normal}
h1,h2,h3{font-family:var(--f-kai);margin:0;text-wrap:balance;line-height:1.3}
h2{font-size:1.45rem}
small,.muted{color:var(--muted)}

/* 頁首與導覽 */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px max(16px,env(safe-area-inset-left,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);flex:none}
.brand .em{font-size:1.8rem}
.brand b{font-family:var(--f-kai);font-size:1.3rem;letter-spacing:.04em}
#nav{display:flex;gap:4px;flex:1;justify-content:center}
#nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);padding:6px 10px;border-radius:14px;min-width:58px;font-size:.85rem}
#nav a .em{font-size:1.5rem}
#nav a.on{background:var(--olive-soft);color:var(--ink);font-weight:700}
.tools{display:flex;gap:6px;flex:none}
.tools button{min-width:44px;padding:6px 8px;font-size:1.15rem}
main{max-width:1180px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 40px}
@media (max-width:860px){
  .top{backdrop-filter:none;background:var(--bg)}
  .brand b{font-size:1.1rem}
  #nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);
    justify-content:space-around;gap:0;padding:4px 2px calc(4px + env(safe-area-inset-bottom,0px))}
  #nav a{min-width:0;flex:1;padding:4px 0;font-size:.7rem}
  #nav a .em{font-size:1.35rem}
  main{padding-bottom:calc(var(--navh) + 40px)}
  .top{justify-content:space-between}
}
@media (max-width:460px){ .brand b{font-size:.95rem;letter-spacing:0} .brand .em{font-size:1.5rem} .tools{gap:4px} .tools button{min-width:40px;min-height:40px;padding:4px 6px;font-size:1rem} .top{gap:6px} }
@media (max-width:380px){ .brand b{display:none} }
@media (max-width:560px){ h2{font-size:1.25rem} .banner{grid-template-columns:1fr;text-align:left} .banner .be{grid-row:auto;font-size:3rem} .banner h1{font-size:1.6rem} }

/* 共用卡片 */
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.8rem;background:var(--soft);color:var(--ink);white-space:nowrap}
.k-talk{--kc:var(--k-talk)} .k-play{--kc:var(--k-play)} .k-work{--kc:var(--k-work)} .k-party{--kc:var(--k-party)} .k-life{--kc:var(--k-life)}
.chip.kind{background:color-mix(in srgb,var(--kc) 18%,transparent);color:var(--ink);border:1px solid color-mix(in srgb,var(--kc) 45%,transparent)}
.lv{display:inline-flex;align-items:center;gap:3px;padding:1px 9px;border-radius:999px;font-size:.8rem;background:var(--olive-soft);white-space:nowrap}
.say{min-width:44px;padding:4px 8px;font-size:1.1rem;border-radius:12px}
.sec-title{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}

/* 本期主題橫幅 */
.banner{--tc:#4E6B2F;border-radius:26px;padding:20px;margin-bottom:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 18px;align-items:center;
  background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 22%,var(--card)),var(--card));border:2px solid color-mix(in srgb,var(--tc) 40%,transparent)}
.banner .be{font-size:4.2rem;grid-row:span 2}
.banner h1{font-size:2rem}
.banner .verse-mini{grid-column:1/-1;font-family:var(--f-kai);font-size:1.25rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  background:color-mix(in srgb,var(--card) 70%,transparent);border-radius:16px;padding:8px 12px}
.banner .verse-mini small{font-family:var(--f-body)}

/* 先／再 板 */
.firstthen{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin-bottom:14px}
.ft{border-radius:20px;padding:14px;text-align:center;background:color-mix(in srgb,var(--kc) 14%,var(--card));border:3px solid color-mix(in srgb,var(--kc) 55%,transparent)}
.ft .em{font-size:3.6rem;display:block;margin:4px 0}
.ft b{font-family:var(--f-kai);font-size:1.25rem}
.ft .lab{font-size:.95rem;color:var(--muted);font-weight:700}
.ft-arrow{align-self:center;font-size:2rem}

/* 節奏表 */
.rhythm{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--card);
  border:2px solid var(--line);border-left:10px solid var(--kc)}
.blk .be{font-size:2.3rem}
.blk .bt{font-weight:700;font-size:1.05rem}
.blk .bm{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.blk .bb{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.blk .bb button{min-height:44px;padding:4px 10px}
.blk.cur{box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 55%,transparent)}
.blk.done{opacity:.55}
.blk.done .bt{text-decoration:line-through}
@media (max-width:560px){ .blk{grid-template-columns:auto 1fr} .blk .bb{grid-column:1/-1;justify-content:flex-start} }

/* 孩子卡 */
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.kid{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;border:2px solid var(--line);background:var(--card)}
.kid .av{font-size:2.6rem}
.kid b{font-size:1.15rem}

/* 晨圈 */
.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.steps a{flex:none;display:flex;flex-direction:column;align-items:center;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:16px;border:2px solid var(--line);background:var(--card);min-width:74px;font-size:.85rem}
.steps a .em{font-size:1.7rem}
.steps a.on{border-color:var(--k-talk);color:var(--ink);font-weight:700;background:color-mix(in srgb,var(--k-talk) 12%,var(--card))}
.stage{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:22px;min-height:52vh}
.stage h2{font-size:1.9rem;margin-bottom:12px}
.stagenav{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.stagenav button{min-height:60px;font-size:1.15rem;padding:8px 22px;border-radius:20px}
.bigtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 8px;border-radius:22px;border:3px solid var(--line);background:var(--card);min-height:140px;font-size:1.1rem;font-weight:700}
.tile .em{font-size:3.4rem}
.tile.on{border-color:var(--ok);background:var(--ok-soft)}
.tile.sel{border-color:var(--star);background:var(--hint)}
.datebig{font-family:var(--f-kai);font-size:2.6rem;line-height:1.2}
.weekstrip{display:flex;gap:6px;margin:12px 0 18px}
.weekstrip span{flex:1;text-align:center;padding:8px 0;border-radius:12px;background:var(--soft);font-weight:700}
.weekstrip span.today{background:var(--olive);color:#fff}
.feelrow{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.feelrow .who{display:flex;gap:8px;align-items:center;font-weight:700;font-size:1.15rem}
.feelrow .who .em{font-size:2.2rem}
.feels{display:flex;gap:8px;flex-wrap:wrap}
.feels button{min-width:78px;min-height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.85rem;border-radius:18px}
.feels button .em{font-size:2.1rem}
.feels button.sel{border-color:var(--star);background:var(--hint);border-width:3px}
@media (max-width:560px){ .feelrow{grid-template-columns:1fr} }
.slide{display:grid;grid-template-columns:minmax(160px,34%) 1fr;gap:20px;align-items:center;min-height:36vh}
.slide .se{font-size:clamp(5rem,13vw,9rem);text-align:center}
.slide p{font-family:var(--f-kai);font-size:clamp(1.4rem,3vw,2.1rem);line-height:1.6;margin:0}
@media (max-width:620px){ .slide{grid-template-columns:1fr;text-align:center} }
.dots{display:flex;gap:6px;justify-content:center;margin-top:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--k-talk)}
.vkeys{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin:6px 0 16px}
.vkeys div{display:flex;flex-direction:column;align-items:center;padding:12px 18px;border-radius:20px;background:var(--soft);font-weight:700;font-size:1.2rem}
.vkeys .em{font-size:3.6rem}
.vtext{font-family:var(--f-kai);font-size:clamp(1.6rem,3.6vw,2.6rem);line-height:1.7;text-align:center}
.vtext span{border-radius:10px;padding:0 2px;transition:background .2s}
.vtext span.hl{background:var(--hint);color:var(--hint-ink)}
.vref{text-align:center;color:var(--muted);font-size:1.1rem;margin-top:6px}
.talkq{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--soft);margin-bottom:10px}
.talkq .em{font-size:2.4rem}
.talkq p{margin:0;font-family:var(--f-kai);font-size:1.35rem}
.aac{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin-top:10px}
.aac button{min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:20px;font-weight:700;font-size:1rem}
.aac button .em{font-size:2.8rem}

/* 主題 */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.th{--tc:#4E6B2F;display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);padding:16px;border-radius:22px;background:color-mix(in srgb,var(--tc) 12%,var(--card));
  border:2px solid color-mix(in srgb,var(--tc) 35%,transparent);position:relative}
.th .em{font-size:3rem}
.th b{font-family:var(--f-kai);font-size:1.35rem}
.th .now{position:absolute;top:10px;right:10px;background:var(--star);color:#3a2a00;font-weight:700;font-size:.8rem;padding:2px 10px;border-radius:999px}
.lvl{border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;background:var(--card)}
.lvl h3{font-size:1.25rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lvl ul{margin:6px 0;padding-left:1.2em}
.lvl li{margin:4px 0}
.task{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.task input{width:24px;height:24px;margin-top:3px;flex:none;accent-color:var(--ok)}
.task .when{font-size:.8rem;color:var(--ok)}
.storylist{display:grid;gap:8px;counter-reset:s}
.storylist div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--soft)}
.storylist .em{font-size:1.8rem}

/* 遊戲選單 */
.pick{display:flex;gap:10px;flex-wrap:wrap}
.pick button{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:110px;min-height:110px;border-radius:22px;border-width:3px}
.pick button>.em{font-size:2.6rem}
.pick button[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-soft)}
.acts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.acts button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 10px;min-height:150px;border-radius:22px;border-width:3px;text-align:center}
.acts button>.em{font-size:3rem}
.acts button b{font-size:1.15rem}
.acts button small{font-size:.8rem}

/* 遊戲畫面（全螢幕） */
.game{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;gap:10px;
  padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.gtop{display:flex;align-items:center;gap:10px}
.gtop .gtitle{flex:1;font-weight:700;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gdots{display:flex;gap:5px;flex-wrap:wrap;max-width:45%}
.gdots i{width:14px;height:14px;border-radius:50%;background:var(--line)}
.gdots i.ok{background:var(--ok)} .gdots i.help{background:var(--star)} .gdots i.cur{outline:3px solid var(--star)}
.gturn{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:700}
.gturn>.em{font-size:2.6rem}
.gturn.multi{animation:pop .5s}
.gq{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.gq .ph{display:flex;gap:10px;align-items:flex-start}
.gprompt{font-family:var(--f-kai);font-size:clamp(1.4rem,3.2vw,2.1rem);line-height:1.45;flex:1}
.gprompt .bigword{font-size:clamp(2.6rem,7vw,4.4rem);display:inline-block;padding:0 12px;border-radius:14px;background:var(--soft)}
.gvis{font-family:var(--f-emoji);font-size:clamp(2.4rem,6.5vw,4.2rem);line-height:1.25;text-align:center;letter-spacing:.06em;word-break:break-all}
.gvis .plus{font-family:var(--f-body);font-size:.7em;color:var(--muted);margin:0 .2em}
.gvis .grp{display:inline-block;border:3px dashed var(--line);border-radius:18px;padding:2px 8px;margin:4px}
.gline{font-family:var(--f-kai);font-size:clamp(1.3rem,3vw,2rem);min-height:1.6em;text-align:center;color:var(--ok)}
.gline:empty::before{content:"＿＿＿＿";color:var(--line)}
.gopts{display:grid;gap:12px;flex:1;align-content:start;grid-template-columns:repeat(var(--cols,2),1fr)}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:24px;border:4px solid var(--line);
  background:var(--card);min-height:clamp(120px,24vh,260px);padding:10px;font-size:clamp(1.1rem,2.6vw,1.6rem);font-weight:700;transition:transform .15s,opacity .3s}
.opt .oe{font-family:var(--f-emoji);font-size:clamp(3.2rem,9vw,6rem);line-height:1.1}
.opt .on{font-size:clamp(3rem,8vw,5.4rem);line-height:1;font-family:var(--f-body)}
.opt .od{font-size:clamp(1rem,2.4vw,1.5rem);letter-spacing:.15em;color:var(--k-play)}
.opt .og{font-family:var(--f-emoji);font-size:clamp(1.8rem,4.6vw,3rem);line-height:1.2;word-break:break-all;text-align:center}
.opt.txt{min-height:clamp(64px,10vh,110px);font-family:var(--f-kai);font-size:clamp(1.25rem,2.8vw,1.8rem);font-weight:400;text-align:center}
.opt.part{min-height:clamp(64px,11vh,120px);font-family:var(--f-kai);font-size:clamp(1.3rem,3vw,2rem);font-weight:400}
.opt.ev{min-height:clamp(110px,18vh,200px)}
.opt.ev .oe{font-size:clamp(2.6rem,6vw,4rem)}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.no{animation:shake .4s}
.opt.gone{opacity:.25;pointer-events:none}
.opt.used{opacity:.4;pointer-events:none;border-style:dashed}
.opt .badge{position:absolute;top:6px;left:8px;background:var(--ok);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:1.1rem}
.opt.hint{animation:glow 1.1s ease-in-out infinite;border-color:var(--star)}
.opt.scan{border-color:var(--k-talk);box-shadow:0 0 0 6px color-mix(in srgb,var(--k-talk) 40%,transparent);transform:scale(1.02)}
.gfoot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.scanbar{width:100%;min-height:max(18vh,110px);font-size:1.8rem;font-weight:700;border-radius:26px;border:4px solid var(--k-talk);background:color-mix(in srgb,var(--k-talk) 14%,var(--card))}
.gexp{background:var(--hint);color:var(--hint-ink);border-radius:18px;padding:12px 16px;font-size:1.1rem}

<script>
'use strict';
/* ---------- 基本工具 ---------- */

const ymd = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

/* 五個程度：依孩子的能力設定，不一定照年齡 */

  { e: '🌱', n: '種子', d: '感官・溝通（支援需求）', opts: 2, rounds: 3 },

  { e: '🍇', n: '結果', d: '小三・小四', opts: 4, rounds: 5 },
  { e: '🌲', n: '香柏', d: '小五・小六', opts: 4, rounds: 5 }
];
const lvChip = L => `<span class="lv" title="${LV[L].d}"><span class="em">${LV[L].e}</span>${LV[L].n}</span>`;
/* 耶拿四種基本活動（加上生活作息） */
const KIND = {
  talk: { e: '💬', n: '對話' }, play: { e: '🎈', n: '遊戲' }, work: { e: '🛠️', n: '工作' }, party: { e: '🎉', n: '慶典' }, life: { e: '🍎', n: '生活' }
};

const GO = { circle: '晨圈', move: '律動', theme: '主題', games: '遊戲', zhuyin: '注音', board: '白板', party: '慶典' };
const ZY_APPS = [['🚂', '注音小火車大冒險', '聽音找符號、拼音、聲調（康軒首冊）', '../kangxuan-chinese/'], ['✍️', '注音筆順小火車', '37 個注音符號在田字格練筆順', '../zhuyin-stroke/']];
const AVATARS = ['🚂', '🐢', '🐣', '🐑', '🦁', '🐟', '🌟', '🪲', '🐻', '🦋', '🐰', '🐬', '🦒', '🌻', '🚀', '🐱'];
const STICKERS = ['🐑', '🕊️', '🌈', '⭐', '🐟', '🍞', '🌾', '🦁', '🐋', '👑', '🦋', '🌷', '🐣', '🚢', '🎵', '🌻', '🍇', '🐢', '🚂', '🪲', '🌙', '☀️', '🫒', '🍎'];
const FEELS = [['😊', '開心'], ['😢', '難過'], ['😠', '生氣'], ['😨', '害怕'], ['😴', '累了'], ['🤒', '不舒服']];

/* ---------- 預設資料 ---------- */
function defaultKids() {
  return [
    { id: 'k1', name: '大寶', av: '🚂', age: 6, L: 2, opts: 3, errorless: false, scan: false, scanMs: 2500, autoSay: true, slowTap: false, zhuyin: true },
    { id: 'k2', name: '二寶', av: '🐢', age: 5, L: 0, opts: 2, errorless: true, scan: false, scanMs: 3000, autoSay: true, slowTap: true, zhuyin: false },
    { id: 'k3', name: '三寶', av: '🐣', age: 4, L: 1, opts: 3, errorless: false, scan: false, scanMs: 2500, autoSay: true, slowTap: false, zhuyin: true }
  ];
}
const B = (e, t, k, min, go = '') => ({ e, t, k, min, go });
function defaultWeek() {
  const day = (mid, extra) => [
    B('⭕', '晨圈：問安・心情・聖經故事', 'talk', 20, 'circle'),
    B('🌍', '主題工作：世界導向（同主題、分程度）', 'work', 40, 'theme'),
    B('🤸', '律動時間', 'play', 15, 'move'),
    B('🍎', '點心・洗手・上廁所', 'life', 15),
    mid,
    ...(mid.go === 'games' ? [zy] : []),
    B('🎈', '自由遊戲・戶外', 'play', 40),
    extra || B('🙏', '晚圈：今天學到什麼・禱告', 'talk', 10, 'circle')
  ];
  const course = B('📚', '課程時間：國語／數學（各自的程度）', 'work', 30, 'games');
  const zy = B('ㄅ', '注音時間：注音小火車・筆順練習（嫩芽、小樹）', 'work', 15, 'zhuyin');
  return {
    1: day(course), 2: day(course),
    3: day(B('🎨', '藝術・音樂（白板畫畫、唱詩歌）', 'work', 30, 'board')),
    4: day(course),
    5: day(B('🎉', '慶典：作品分享・讚美・獎勵', 'party', 30, 'party'), B('🙏', '晚圈：一週回顧・感恩禱告', 'talk', 10, 'circle')),
    6: [B('🌳', '家庭日：戶外探索、郊遊、拜訪', 'play', 120), B('🧑‍🍳', '一起做家事・料理', 'work', 30)],
    0: [B('⛪', '主日：敬拜與休息', 'party', 0)]
  };
}
const MONTH_THEME = { 9: 0, 10: 2, 11: 4, 12: 7, 1: 6, 2: 8, 3: 9, 4: 10, 5: 11, 6: 1, 7: 0, 8: 0 };

const S = {
  kids: store.get('kids', null) || defaultKids(),
  theme: store.get('theme', MONTH_THEME[new Date().getMonth() + 1] ?? 0),
  week: store.get('week', null) || defaultWeek(),
  day: store.get('day', { d: '', cur: 0, done: [] }),
  att: store.get('att', {}), weather: store.get('weather', {}), feel: store.get('feel', {}),
  log: store.get('log', []), notes: store.get('notes', []), done: store.get('done', {}),
  stars: store.get('stars', {}), stickers: store.get('stickers', {})
};
if (S.theme >= THEMES.length) S.theme = 0;
S.kids.forEach(k => { if (k.zhuyin === undefined) k.zhuyin = k.L >= 1 && k.L <= 2; });
function save(...keys) { for (const k of keys) store.set(k, S[k]); }
function today() { const d = ymd(); if (S.day.d !== d) { S.day = { d, cur: 0, done: [] }; save('day'); } return S.day; }
const curTheme = () => THEMES[S.theme];
const kidById = id => S.kids.find(k => k.id === id);

/* ---------- 聲音 ---------- */
let soundOn = store.get('sound', true), zhVoice = null, voices = [], actx = null;
let voicePref = store.get('voice', ''), rate = store.get('rate', 0.85), speakSeq = 0;
function twScore(v) {
  const s = (v.lang + ' ' + v.name).toLowerCase(); let sc = 0;
  if (/zh[-_]tw|cmn[-_]hant[-_]tw|hant[-_]tw/.test(s)) sc += 100;
  if (/臺灣|台灣|taiwan|國語/.test(s)) sc += 60;
  if (/hsiaochen|hsiaoyu|yating|mei-?jia|zhiwei|yunjhe|hanhan/.test(s)) sc += 20;
  if (/natural|online|neural|enhanced|premium|高品質/.test(s)) sc += 15;
  if (/zh[-_]hk|yue|cantonese|粵|廣東/.test(s)) sc -= 80;
  if (/zh[-_]cn|cmn[-_]hans|普通话|mainland/.test(s)) sc -= 40;
  return sc;
}
const isTW = v => twScore(v) >= 60;
function loadVoice() {
  voices = speechSynthesis.getVoices().filter(v => /^(zh|cmn|yue)/i.test(v.lang)).sort((a, b) => twScore(b) - twScore(a));
  zhVoice = voices.find(v => v.voiceURI === voicePref) || voices.filter(isTW)[0] || null;
  if ($('#voiceSel')) renderVoice();
}
if ('speechSynthesis' in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
const clean = t => String(t).replace(/<[^>]+>/g, '').replace(/[＿_]{2,}/g, '空格').replace(/[🌀-🫸☀-➿️‍]/gu, ' ').replace(/\s+/g, ' ').trim();
/* 念出文字；回傳 Promise，念完（或被下一句打斷）時結束，值為「是否還是最新的一句」 */
function speak(text, r) {
  return new Promise(res => {
    const id = ++speakSeq; const t = clean(text || '');
    if (!soundOn || !('speechSynthesis' in window) || !t) { setTimeout(() => res(id === speakSeq), 10); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = zhVoice ? zhVoice.lang : 'zh-TW'; u.rate = r || rate; u.pitch = 1.05;
    if (zhVoice) try { u.voice = zhVoice; } catch {}
    let fin = false; const end = () => { if (!fin) { fin = true; clearTimeout(to); res(id === speakSeq); } };
    const to = setTimeout(end, 1500 + t.length * 380 / u.rate);
    u.onend = end; u.onerror = end;
    speechSynthesis.speak(u);
  });
}
function hush() { speakSeq++; if ('speechSynthesis' in window) speechSynthesis.cancel(); }
const wait = ms => new Promise(r => setTimeout(r, ms));
function tone(freqs, dur = .12, type = 'sine', vol = .12) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain(), t0 = actx.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur * 1.6);
      o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + dur * 1.7);
    });
  } catch {}
}
const sndOk = () => tone([660, 880], .1);
const sndSoft = () => tone([300], .12, 'triangle', .06);
const sndWin = () => tone([523, 659, 784, 1047], .13);
function confetti(n = 36) {
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches; if (reduce) n = 8;
  const em = ['🎉', '⭐', '✨', '🌈', '🎈', '💛', '🫒'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'confetti em'; s.textContent = pick(em);
    s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = (2 + Math.random() * 2) + 's'; s.style.animationDelay = Math.random() * .6 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 5000);
  }
}
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b) { e.preventDefault(); speak(b.dataset.say); } });
/* ---------- 注音 ---------- */
const ZYC = window.JENA_ZY_C || {}, ZYW = window.JENA_ZY_W || {}, ZY_MAX = 5;
const HANC = /[㐀-鿿豈-﫿]/;
const zyOn = () => store.get('zy', true);
function zyRuby(c, b) {
  if (!b) return c;
  let light = false, tone = '';
  if (b[0] === '˙') { light = true; b = b.slice(1); }
  if ('ˊˇˋ'.includes(b.slice(-1))) { tone = b.slice(-1); b = b.slice(0, -1); }
  return `<span class="zy">${c}<span class="zb" aria-hidden="true">${light ? '<i class="zl">˙</i>' : ''}${[...b].map(x => `<i>${x}</i>`).join('')}${tone ? `<i class="zt">${tone}</i>` : ''}</span></span>`;
}
/* 對已跳脫、不含標籤的文字加注音：先找最長的詞，找不到再用字的預設讀音 */
function zyText(s) {
  const a = [...String(s)]; let out = '', i = 0;
  while (i < a.length) {
    if (!HANC.test(a[i])) { out += a[i++]; continue; }
    let L = Math.min(ZY_MAX, a.length - i), hit = null;
    for (; L >= 2; L--) { const r = ZYW[a.slice(i, i + L).join('')]; if (r) { hit = r.split(' '); break; } }

let TM = null;
function startTimer(min, e, label) {
  stopTimer();
  const total = min * 60000; let left = total, last = Date.now(), paused = false;
  const L = $('#layer');
  L.innerHTML = `<div class="timer" role="dialog" aria-label="計時器">
    <div class="tl"><span class="em">${e}</span> ${esc(label.split('：')[0])}</div>
    <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--line)" stroke-width="4"/>
      <path id="pie" fill="var(--k-play)"/></svg>
    <div id="tleft" class="tl"></div>
    <div class="row"><button id="tpause">⏸ 暫停</button><button id="tadd">＋1 分鐘</button><button id="tclose" class="pri">✕ 關閉</button></div>
  </div>`;
  const draw = () => {
    const f = Math.max(0, left / total), a = f * Math.PI * 2;
    const x = 50 + 44 * Math.sin(a), y = 50 - 44 * Math.cos(a);
    $('#pie').setAttribute('d', f >= .9999 ? 'M50 6 A44 44 0 1 1 49.99 6 Z' : f <= 0 ? '' : `M50 50 L50 6 A44 44 0 ${a > Math.PI ? 1 : 0} 1 ${x} ${y} Z`);
    const m = Math.ceil(left / 60000); $('#tleft').textContent = left <= 0 ? '時間到了！' : `還有 ${m} 分鐘`;
  };
  draw();
  TM = setInterval(() => {
    const n = Date.now(); if (!paused) left -= n - last; last = n; draw();
    if (left <= 0) { clearInterval(TM); TM = null; sndWin(); speak('時間到了！'); }
  }, 500);
  $('#tpause').onclick = e => { paused = !paused; e.target.textContent = paused ? '▶ 繼續' : '⏸ 暫停'; };
  $('#tadd').onclick = () => { left += 60000; if (!TM) { last = Date.now(); startTimer(Math.ceil(left / 60000), e, label); } };
  $('#tclose').onclick = stopTimer;
}

/* ======================== 遊戲引擎 ======================== */
const ACTS = [
  { k: 'vocab', e: '🎧', n: '聽一聽', d: '聽詞語、找圖片；大孩子讀詞語', min: 0 },
  { k: 'math', e: '🔢', n: '數一數', d: '數數、比多少 → 加減乘除、分數', min: 0 },
  { k: 'sort', e: '🧺', n: '分一分', d: '把東西放到對的地方', min: 0 },
  { k: 'order', e: '📜', n: '排一排', d: '故事先後順序', min: 0 },
  { k: 'verse', e: '📖', n: '經文', d: '找經文圖卡 → 排出整節經文', min: 0 },
  { k: 'quiz', e: '❓', n: '想一想', d: '故事理解與自然、社會延伸', min: 2 },
  { k: 'mix', e: '🎲', n: '綜合', d: '每一題隨機換遊戲', min: 0 }
];
const optsMax = k => Math.max(2, Math.min(4, k.opts || LV[k.L].opts));
const OPT = (e, t, extra = {}) => ({ e, t, ...extra });
const okey = o => `${o.e || ''}|${o.t || ''}|${o.num ?? ''}|${o.grp ?? ''}`;
function choose(q, correct, wrongs, max) {
  const seen = new Set([okey(correct)]), w = [];
  for (const o of shuffle(wrongs)) { const k = okey(o); if (!seen.has(k)) { seen.add(k); w.push(o); } }
  const opts = shuffle([correct, ...w.slice(0, max - 1)]);
  return { ui: 'choose', ...q, opts, ans: opts.indexOf(correct) };
}
const allItems = () => THEMES.flatMap(t => t.items);
const emo = (e, n) => Array(n).fill(e).join('');
function nums(ans, max, lo = 0, dots = false, cands) {
  const c = (cands || [ans + 1, ans - 1, ans + 2, ans - 2, ans + 10, ans - 10, ans * 2, Math.round(ans / 2), ans + 5, ans - 5])
    .filter(n => Number.isInteger(n) && n >= lo && n !== ans);
  return { correct: { num: ans, dots }, wrongs: [...new Set(c)].slice(0, 6).map(n => ({ num: n, dots })) };
}
function numQ(q, ans, max, lo, dots, cands) { const { correct, wrongs } = nums(ans, max, lo, dots, cands); return choose(q, correct, wrongs, max); }

const GEN = {
  vocab(k, T) {
    const max = optsMax(k), [e, t] = pick(T.items);
    const others = (k.L >= 3 ? allItems() : T.items).filter(x => x[1] !== t && x[0] !== e).map(([a, b]) => OPT(a, b));
    if (k.L <= 1) return choose({ prompt: `找一找：<b>${esc(t)}</b>在哪裡？`, say: `${t}，${t}在哪裡？` }, OPT(e, t), others, max);
    if (k.L === 2) return choose({ prompt: `讀一讀：<span class="bigword">${esc(t)}</span> 是哪一個？`, say: '讀一讀，這個詞是哪一個圖？' }, OPT(e, ''), others.map(o => OPT(o.e, '')), max);
    return choose({ prompt: '這是什麼？選出正確的詞語。', vis: e, say: '這是什麼？選出正確的詞語。', txt: true }, OPT('', t), others.map(o => OPT('', o.t)), max);
  },
  math(k, T) {
    const [e, n, u] = T.m, max = optsMax(k), L = k.L, r = Math.random();
    if (L === 0) {
      if (r < .6) { const c = rnd(1, 3); return numQ({ prompt: `數一數，有幾${u}${n}？`, vis: emo(e, c) }, c, max, 1, true, [1, 2, 3, 4]); }
      const a = rnd(1, 4); let b = rnd(1, 4); while (b === a) b = rnd(1, 4);
      return choose({ prompt: `哪一邊的${n}比較多？` }, { grp: Math.max(a, b), e }, [{ grp: Math.min(a, b), e }], 2);
    }
    if (L === 1) {
      if (r < .4) { const c = rnd(3, 10); return numQ({ prompt: `數一數，有幾${u}${n}？`, vis: emo(e, c) }, c, max, 1, true); }
      if (r < .65) {
        const a = rnd(1, 8); let b = rnd(1, 8); while (b === a) b = rnd(1, 8); const more = Math.random() < .6;
        return choose({ prompt: `哪一邊的${n}比較${more ? '多' : '少'}？` }, { grp: more ? Math.max(a, b) : Math.min(a, b), e }, [{ grp: more ? Math.min(a, b) : Math.max(a, b), e }], 2);
      }
      const a = rnd(1, 6), b = rnd(1, 3);
      return numQ({ prompt: `有 ${a} ${u}${n}，又來了 ${b} ${u}，現在有幾${u}？`, vis: `${emo(e, a)}<span class="plus">＋</span>${emo(e, b)}` }, a + b, max, 1, true);
    }
    if (L === 2) {
      if (r < .3) { const a = rnd(2, 9), b = rnd(1, 9); return numQ({ prompt: `${a} ${u}${n}加 ${b} ${u}，一共幾${u}？`, vis: a + b <= 12 ? `${emo(e, a)}<span class="plus">＋</span>${emo(e, b)}` : '', say: `${a}加${b}等於多少？` }, a + b, max, 0); }
      if (r < .55) { const a = rnd(6, 18), b = rnd(1, Math.min(9, a - 1)); return numQ({ prompt: `有 ${a} ${u}${n}，拿走 ${b} ${u}，還剩幾${u}？`, say: `${a}減${b}等於多少？` }, a - b, max, 0); }
      if (r < .8) { const a = rnd(11, 60), b = rnd(10, 39); return numQ({ prompt: `${a} ＋ ${b} ＝ ？`, say: `${a}加${b}等於多少？` }, a + b, max, 0); }
      const g = rnd(2, 5), m = pick([2, 5, 10]);
      return numQ({ prompt: `有 ${g} 堆，每堆 ${m} ${u}${n}，一共幾${u}？`, vis: g * m <= 20 ? Array(g).fill(`<span class="grp">${emo(e, m)}</span>`).join('') : '' }, g * m, max, 0);
    }
    if (L === 3) {
      if (r < .3) { const a = rnd(2, 9), b = rnd(3, 9); return numQ({ prompt: `每排 ${a} ${u}${n}，排了 ${b} 排，一共幾${u}？` }, a * b, max, 0, false, [a * b + a, a * b - a, a * b + b, a * b - b, a + b, a * b + 10]); }
      if (r < .55) { const b = rnd(2, 9), q = rnd(2, 9); return numQ({ prompt: `${b * q} ${u}${n}平分給 ${b} 個人，每人分到幾${u}？` }, q, max, 1); }
      if (r < .8) { const k2 = pick([2, 3, 4, 5]), tot = k2 * rnd(2, 8); return numQ({ prompt: `${tot} ${u}${n}的 1/${k2} 是幾${u}？`, say: `${tot}${u}${n}的${k2}分之1是幾${u}？` }, tot / k2, max, 1); }
      const a = rnd(120, 480), b = rnd(105, 450); return numQ({ prompt: `${a} ＋ ${b} ＝ ？` }, a + b, max, 0, false, [a + b + 10, a + b - 10, a + b + 100, a + b - 100, a + b + 1]);
    }
    if (r < .25) { const q = pick([3, 4, 5, 6, 8]), p = rnd(2, q - 1), tot = q * rnd(2, 12); return numQ({ prompt: `${tot} ${u}${n}的 ${p}/${q} 是幾${u}？`, say: `${tot}${u}${n}的${q}分之${p}是幾${u}？` }, tot / q * p, max, 1, false, [tot / q, tot / q * (p + 1), tot / q * p + 1, tot - tot / q * p]); }
    if (r < .45) { const pc = pick([10, 20, 25, 50, 75]), tot = rnd(2, 15) * 20; return numQ({ prompt: `${tot} ${u}${n}的 ${pc}% 是幾${u}？`, say: `${tot}${u}${n}的百分之${pc}是幾${u}？` }, tot * pc / 100, max, 1); }
    if (r < .65) { const a = rnd(10, 40), b = rnd(10, 40), c0 = rnd(10, 40), c = c0 + (3 - (a + b + c0) % 3) % 3; return numQ({ prompt: `三天各收集了 ${a}、${b}、${c} ${u}${n}，平均每天幾${u}？` }, (a + b + c) / 3, max, 1); }
    if (r < .85) { const w = rnd(4, 15), h = rnd(3, 12); return Math.random() < .5 ? numQ({ prompt: `長方形菜園長 ${w} 公尺、寬 ${h} 公尺，面積是幾平方公尺？` }, w * h, max, 1, false, [2 * (w + h), w * h + w, w * h - h, w + h]) : numQ({ prompt: `長方形菜園長 ${w} 公尺、寬 ${h} 公尺，周長是幾公尺？` }, 2 * (w + h), max, 1, false, [w * h, w + h, 2 * (w + h) + 2, 2 * w + h]); }
    const v = rnd(3, 6), t = rnd(2, 8); return numQ({ prompt: `每小時走 ${v} 公里，走了 ${t} 小時，一共走幾公里？` }, v * t, max, 1);
  },
  sort(k, T) {
    const [e, t, bi] = pick(T.sort.items), bins = T.sort.bins.map(([a, b]) => OPT(a, b));
    return choose({ prompt: `${esc(t)}：${esc(T.sort.q)}`, vis: e, say: `${t}，${T.sort.q}` }, bins[bi], bins.filter((_, i) => i !== bi), Math.max(2, Math.min(bins.length, optsMax(k))));
  },
  order(k, T) {
    const ev = T.order.map(([e, t]) => OPT(e, t));
    if (k.L === 0) {
      const i = rnd(0, ev.length - 2), j = rnd(i + 1, ev.length - 1);
      return choose({ prompt: '哪一個先發生？', say: `${ev[i].t}，還是${ev[j].t}？哪一個先發生？` }, ev[i], [ev[j]], 2);
    }
    if (k.L === 1) {
      const i = rnd(0, ev.length - 2);
      return choose({ prompt: `「${ev[i].e} ${esc(ev[i].t)}」，接下來呢？`, say: `${ev[i].t}，接下來發生什麼事？` }, ev[i + 1], ev.filter((_, j) => j !== i + 1 && j !== i), optsMax(k));
    }
    const n = k.L === 2 ? Math.min(4, ev.length) : ev.length;
    const idx = sample(ev.map((_, i) => i), n).sort((a, b) => a - b);
    return { ui: 'order', prompt: '照故事的順序，一個一個點。', say: '照故事發生的順序，一個一個點。', items: idx.map(i => ev[i]) };
  },
  verse(k, T) {
    const V = T.verse, max = optsMax(k);
    if (k.L <= 1) {
      const [e, t] = pick(V.keys);
      const others = [...T.items, ...V.keys].filter(x => x[0] !== e && x[1] !== t).map(([a, b]) => OPT(a, b));
      return choose({ prompt: `經文：「${esc(V.sp.join(''))}」<br>找一找：<b>${esc(t)}</b>`, say: `${V.sp.join('')}。${t}在哪裡？` }, OPT(e, t), others, max);
    }
    if (k.L === 4 && Math.random() < .4) {
      const refs = THEMES.filter(x => x !== T).map(x => OPT('', x.verse.ref));
      return choose({ prompt: `「${esc(V.fp.join(''))}」<br>這節經文出自哪裡？`, txt: true }, OPT('', V.ref), refs, max);
    }
    const parts = k.L === 2 ? V.sp : V.fp;
    return { ui: 'order', prompt: k.L === 2 ? '聽一聽，再把經文排好。' : `把經文排好（${esc(V.ref)}）`, say: k.L === 2 ? '聽一聽，再把經文排好。' + parts.join('') : '把經文排好。', items: parts.map(p => OPT('', p)), text: true, line: true, done: parts.join('') + (k.L >= 3 ? '　' + V.ref : '') };
  },
  quiz(k, T) {
    if (k.L < 2) return GEN.vocab(k, T);
    const pool = [...(T.quiz[k.L] || []), ...(k.L > 2 ? T.quiz[k.L - 1] || [] : [])];
    const fresh = pool.filter(q => !G.used.has(q[0]));
    const q = pick(fresh.length ? fresh : pool); G.used.add(q[0]);
    const opts = q[1].map(t => OPT('', t));
    return choose({ prompt: esc(q[0]), say: q[0] + '　' + q[1].join('、'), txt: true, exp: q[3] }, opts[q[2]], opts.filter((_, i) => i !== q[2]), Math.max(optsMax(k), Math.min(3, q[1].length)));
  }
};
function genFor(act, k, T) {
  let a = act;
  if (a === 'mix') a = pick(ACTS.filter(x => x.k !== 'mix' && x.min <= k.L && !(x.k === 'sort' && k.L >= 3)).map(x => x.k));
  for (let i = 0; i < 6; i++) {
    const q = GEN[a](k, T); q.act = a;
    const key = a + ':' + clean(q.prompt) + (q.vis || '') + (q.ans != null ? okey(q.opts[q.ans]) : '');
    if (!G.used.has(key) || i === 5) { G.used.add(key); return q; }
  }
}

/* ---------- 遊戲進行 ---------- */
let G = null;
function startGame(kids, T, act) {
  const turns = [];

  <p>照順序有 8 個步驟，按上方的分頁或下方的「下一步」切換。大約 20 分鐘；小小孩坐不住時，可以只做前三項和律動。</p>
  <ol>
    <li><b>👋 問安</b>：每個孩子點自己的頭像，系統會說「早安，大寶！神愛你！」</li>
    <li><b>📅 今天</b>：日期、星期，再選今天的天氣。</li>
    <li><b>😊 心情</b>：每人選一個心情。選了難過或生氣，會提醒大家等一下為他禱告。</li>
    <li><b>📖 故事</b>：本期聖經故事，一張大圖一句話，自動念出來。</li>
    <li><b>📜 經文</b>：念全節（念到的那一句會亮起來）、跟我念（念一句停一下讓孩子跟著說）、給小小孩的短句、用手勢一起記經文。</li>
    <li><b>💬 對話</b>：每個孩子拿到自己程度的問題。下面有圖卡回答板（是、不是、還要、好了、幫幫我，加上主題圖卡），點一下就會說出來，不太會說話的孩子可以用它回答。</li>
    <li><b>🙏 禱告</b>：點感謝或代禱的圖卡，系統會念出禱告句，最後按「阿們」。</li>
    <li><b>🤸 律動</b>：主題相關的大肢體動作，有 1 分鐘和 3 分鐘計時。</li>
  </ol></section>
<section class="card mod" id="m-theme"><h2><span class="em">🌍</span>主題：12 個聖經故事<a href="#/theme">前往 ▶</a></h2>
  <ul>
    <li>一年 12 個主題，每個大約 3 週，從「神創造世界」到「好撒瑪利亞人」。每個主題都延伸到自然、數學、語文等科目，例如挪亞方舟連到天氣、彩虹和測量。</li>
    <li>打開一個主題可以看到：<b>聖經故事</b>全文；<b>分程度的內容</b>（5 個程度各有對話題和動手做的工作，旁邊顯示哪個孩子在哪個程度，工作打勾後會記下完成日期）；<b>律動與慶典</b>建議。</li>
    <li><b>⭐ 設為本期主題</b>：首頁、晨圈和遊戲都會改成這個主題。</li>
    <li><b>🖨️ 列印主題教案</b>：包含各程度的活動、題目，以及給每個孩子寫觀察紀錄的欄位。</li>
  </ul></section>
<section class="card mod" id="m-games"><h2><span class="em">🎮</span>遊戲：混齡輪流玩<a href="#/games">前往 ▶</a></h2>
  <ul>
    <li><b>選一個孩子</b>就是自己玩；<b>選兩個以上</b>就是輪流玩，每個人拿到自己程度的題目。</li>
    <li><b>🙋 小幫手提示</b>：按了正確答案會發亮，哥哥姊姊可以用來幫弟弟妹妹。</li>
    <li>玩完會得到 1～3 顆星星，每 10 顆換一張貼紙。鍵盤數字鍵 1～4 可以選答案，Esc 離開。</li>
    <li><b>ㄅ 注音</b>：題目要不要加注音，在「家長 › 孩子與輔助設定」為每個孩子設定（預設嫩芽、小樹有注音）。遊戲頁下方另有「注音小火車大冒險」和「注音筆順小火車」兩個注音遊戲。</li>
  </ul>
  <div class="tblwrap" style="max-height:none"><table class="tbl"><tr><th>遊戲</th><th>小的孩子</th><th>大的孩子</th></tr>
    <tr><td>🎧 聽一聽</td><td>聽詞語、找圖片</td><td>讀詞語、選詞</td></tr>

    <tr><td>🧺 分一分</td><td>天空／海裡、晴天／雨天</td><td>同左</td></tr>
    <tr><td>📜 排一排</td><td>哪個先發生</td><td>把整個故事排順序</td></tr>
    <tr><td>📖 經文</td><td>找經文裡的圖卡</td><td>排出整節經文、認出處</td></tr>
    <tr><td>❓ 想一想</td><td>（自動改玩聽一聽）</td><td>故事理解、自然社會延伸</td></tr>
    <tr><td>🎲 綜合</td><td colspan="2">每一題隨機換一種遊戲</td></tr></table></div></section>

    <li>背景可以選空白、橫線、田字格、方格或點點，田字格適合練寫字。</li>
    <li><b>🖼️ 貼圖</b>：點一下就貼上主題圖案，手部動作不靈活的孩子也能「畫」。</li>
    <li><b>💾 存圖</b>：存成圖片，可以放進學習歷程。<b>⛶ 白板全螢幕</b>：隱藏其他按鈕，整面都是白板。</li>
  </ul></section>
<section class="card mod" id="m-party"><h2><span class="em">🎉</span>慶典：每週五的分享與讚美<a href="#/party">前往 ▶</a></h2>
  <ul>
    <li>每個孩子這週拿到的星星、玩了幾次、貼紙本（這週新拿到的貼紙會發亮）。</li>
    <li><b>🎉 為孩子慶祝</b>：放彩帶，並說「這一週你做得很好！神愛你！」</li>
    <li>本週經文、這週完成的工作，以及建議的慶典流程（唱詩歌、分享作品、感謝接龍、禱告）。</li>
  </ul></section>
<section class="card mod" id="m-parent"><h2><span class="em">⚙️</span>家長<a href="#/parent">前往 ▶</a></h2>
  <ul>
    <li><b>👧 孩子與輔助設定</b>（每個孩子分開設）：名字、頭像、年齡、程度；選項數量（2、3 或 4 選 1）；可以新增孩子。
      <ul><li><b>無錯誤學習</b>：答錯不會有失敗的聲音，錯的選項會淡掉，6 秒沒反應會提示正確答案。</li>
        <li><b>掃描選擇</b>：選項輪流亮起並念出來，按下面的大按鈕（或空白鍵、大型按鍵開關）就能選。</li>
        <li><b>自動念題目</b>、<b>防誤觸</b>（忽略手不穩時太快的連點）、<b>遊戲題目加注音</b>。</li></ul></li>
    <li><b>🗓️ 週節奏表</b>：每天的時段可以新增、刪除、排順序，設定活動類型和分鐘數，也能複製到其他天或列印貼在牆上。</li>
    <li><b>📊 學習紀錄</b>：遊戲紀錄、心情紀錄和觀察筆記；匯出 CSV 可以拿來寫自學（實驗教育）的成果報告；備份全部資料、還原備份。</li>
    <li><b>🔊 聲音</b>：選台灣國語的語音、調整說話速度、試聽。</li>
    <li><b>📘 使用說明與教學理念</b>：耶拿教育的理念，以及給特殊需求孩子的調整建議。</li>
  </ul></section>
<section class="card mod" id="m-levels"><h2><span class="em">🌱</span>五個程度（依能力設定，不一定照年齡）</h2>

</div>`;
function vHelp() {
  $('#view').innerHTML = HELP;
  $('#view').onclick = e => {
    const j = e.target.closest('[data-jump]'); if (j) { document.getElementById(j.dataset.jump).scrollIntoView({ behavior: 'smooth' }); return; }
    if (e.target.id === 'helpPrint') { $('#print').innerHTML = '<h1>🫒 橄欖栽子家學堂　使用手冊</h1>' + $('#helpdoc').innerHTML.replace(/<a href="#\/[^"]*">前往 ▶<\/a>/g, ''); window.print(); }
  };
}
