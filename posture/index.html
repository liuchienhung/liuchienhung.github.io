<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>寫字姿勢即時偵測</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F3A5F; --paper:#FAFBFC; --line:#D9E1EA; --pencil:#F2C230;
  --good:#2E8B57; --warn:#D99A00; --bad:#D1453B; --text:#1C2530; --muted:#5B6B7C; --card:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1722; --card:#172233; --line:#2A3A50; --text:#E6ECF3; --muted:#9AAABB; --ink:#8FB4E0;
}}
:root[data-theme="dark"]{
  --paper:#0F1722; --card:#172233; --line:#2A3A50; --text:#E6ECF3; --muted:#9AAABB; --ink:#8FB4E0;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%} body{margin:0;min-height:100%;background:var(--paper);color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:16px;line-height:1.5}
header{padding:14px 16px 8px}
h1{margin:0;font-size:1.25rem;color:var(--ink);font-weight:700}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.stage{position:relative;margin:0 12px;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:3/4;max-height:58vh}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mirror{transform:scaleX(-1)}
.banner{position:absolute;left:10px;right:10px;top:10px;padding:8px 12px;border-radius:10px;font-weight:700;
  background:var(--bad);color:#fff;display:none;font-size:.95rem}
.viewtag{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.55);color:#fff;padding:3px 10px;border-radius:20px;font-size:.8rem}
.hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px;font-size:.95rem}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 12px}
.m{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:10px;padding:8px 10px}
.m .k{font-size:.8rem;color:var(--muted)} .m .v{font-size:1.3rem;font-weight:700}
.m.good{border-left-color:var(--good)} .m.warn{border-left-color:var(--warn)} .m.bad{border-left-color:var(--bad)}
.m.off{opacity:.45}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:4px 12px 12px}
.nick{flex:1 1 100%;display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted)}
.nick input{flex:1;min-width:0;font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.nick input:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
button,select{font:inherit;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:10px 12px;min-height:44px}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink);flex:1 1 100%;font-weight:700}
button:focus-visible,select:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
#report{margin:0 12px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:none}
.rep h2{margin:0 0 6px;font-size:1.05rem;color:var(--ink)}
.rep h3{margin:14px 0 4px;font-size:.95rem}
.rep ol,.rep ul{margin:4px 0;padding-left:1.3em}
.rep li{margin:4px 0}
.rep.pdf{display:block;width:720px;margin:0;border:0;border-radius:0;padding:0;background:#fff;color:#1C2530}
.ex{margin:6px 0 10px;padding:8px 10px;border-radius:8px;background:var(--paper);border:1px dashed var(--line)}
.ex b{color:var(--ink)} .ex .dose{display:inline-block;margin-left:4px;padding:0 6px;border-radius:6px;background:var(--pencil);color:#1C2530;font-size:.75rem;font-weight:700}
.ex p{margin:2px 0 0;font-size:.88rem}
.exbtn{min-height:36px;padding:4px 10px;margin-top:6px;font-size:.85rem;color:var(--ink);border-color:var(--ink)}
[hidden]{display:none!important}
.exlib{margin:0 12px 16px}
.exlib h2{font-size:1.05rem;color:var(--ink);margin:8px 0}
.exlib .primary{width:100%;margin-bottom:10px}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.excard{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;padding:8px}
.excard svg{width:72px;height:72px}
.excard .n{font-weight:700;font-size:.9rem} .excard .d{font-size:.75rem;color:var(--muted)}
.fig line,.fig path,.fig circle{stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fig circle{fill:var(--card)} .fig .env{stroke:var(--line);stroke-width:3}
.fig .pb{display:none} .fig.b .pa{display:none} .fig.b .pb{display:inline}
.tut{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding-top:env(safe-area-inset-top,0px)}
.tut-box{background:var(--card);color:var(--text);width:100%;max-width:520px;max-height:100%;overflow:auto;border-radius:16px 16px 0 0;
  padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.tut-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tut-head h2{margin:0;font-size:1.15rem;color:var(--ink);flex:1}
.tut-head button{min-height:40px;padding:4px 12px}
.tut-fig{display:flex;justify-content:center;margin:6px 0}
.tut-fig svg{width:min(62vw,240px);height:auto}
.tut-timer{text-align:center;font-size:2.4rem;font-weight:700;color:var(--ink);min-height:1.3em;font-variant-numeric:tabular-nums}
.tut-cue{text-align:center;font-size:1.05rem;min-height:1.6em;font-weight:500}
.tut-steps{padding-left:1.4em;margin:8px 0}
.tut-steps li{margin:4px 0;padding:2px 6px;border-radius:6px}
.tut-steps li.on{background:var(--pencil);color:#1C2530;font-weight:700}
.tut-btns{display:flex;gap:8px} .tut-btns button{flex:1}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;display:flex;margin:2px 0 6px}
.bar i{display:block;height:100%}
.small{font-size:.82rem;color:var(--muted)}
.rep-actions{display:flex;gap:8px;margin:0 0 8px}
.rep-actions button{flex:1}
.snaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:6px 0}
.snap{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper);break-inside:avoid}
.snap img{display:block;width:100%;height:auto;background:#000}
.snap figcaption{padding:6px 8px;font-size:.78rem;line-height:1.45}
.snap .tag{display:inline-block;padding:0 6px;margin-right:4px;border-radius:6px;color:#fff;font-weight:700;background:var(--ink)}
.snap .tag.worst{background:var(--bad)}
.snap-opts{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:4px 0 6px;font-size:.88rem}
.snap-opts label{display:flex;align-items:center;gap:6px;min-height:40px;cursor:pointer}
.snap-opts input{width:20px;height:20px;accent-color:var(--ink)}
.lv-good{color:var(--good)} .lv-warn{color:var(--warn)} .lv-bad{color:var(--bad);font-weight:700}
@media print{
  body>*:not(#report){display:none!important}
  #report{display:block!important;border:0;margin:0;padding:0}
  [data-html2canvas-ignore]{display:none!important}
}
.fit{margin:0 12px 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.fit h2{margin:0 0 4px;font-size:1.05rem;color:var(--ink)}
.fit-form{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.fit-form label{display:flex;flex-direction:column;gap:2px;font-size:.82rem;color:var(--muted)}
.fit-form input{font:inherit;color:var(--text);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
.fit-form input:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
.fit-form .full{grid-column:1/-1}
.fit details{margin:4px 0 8px;font-size:.88rem}
.fit summary{cursor:pointer;color:var(--ink);font-weight:500;min-height:32px}
.fit-out{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:8px 0}
.fit-out .m .v{font-size:1.15rem}
.fit-fig{display:flex;justify-content:center;margin:4px 0}
.fit-fig svg{width:min(100%,300px);height:auto}
.fit-fig line,.fit-fig rect,.fit-fig circle,.fit-fig path{stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;fill:none}
.fit-fig circle{fill:var(--card)}
.fit-fig .fur{stroke:var(--muted)} .fit-fig .fr{fill:var(--pencil);stroke:#8a6d00}
.fit-fig text{fill:var(--muted);font-size:9px;stroke:none}
.fit ul{margin:4px 0;padding-left:1.3em} .fit li{margin:4px 0}
</style>
</head>
<body>
<header>
  <a href="../" style="color:var(--muted);font-size:.85rem;text-decoration:none">← 回服務首頁</a>
  <h1>寫字姿勢即時偵測</h1>
  <p>手機放在孩子側面約 1–1.5 公尺、與肩同高，拍到頭、肩、髖。影像只在本機運算，不上傳。</p>
  <p id="devInfo" class="small"></p>
</header>

<div class="stage" id="stage">
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="banner" id="banner"></div>
  <div class="viewtag" id="viewtag">—</div>
  <div class="hint" id="hint">按「開始偵測」開啟相機</div>
</div>

<div class="metrics" id="metrics"></div>

<div class="controls">
  <label class="nick">稱呼<input id="nickInput" type="text" maxlength="10" autocomplete="off" placeholder="例如：小明、寶貝（選填，提醒時會先叫名字）"></label>
  <button class="primary" id="startBtn">開始偵測</button>
  <select id="viewSel" aria-label="拍攝角度">
    <option value="auto">角度：自動</option>
    <option value="side">角度：側面</option>
    <option value="front">角度：正面</option>
  </select>
  <button id="flipBtn" hidden>切換鏡頭</button>
  <select id="alertSel" aria-label="提醒方式">
    <option value="voice">提醒：語音</option>
    <option value="beep">提醒：提示音</option>
    <option value="off">提醒：關閉</option>
  </select>
  <button id="testVoiceBtn">試聽語音</button>
  <button id="reportBtn">結束並產生報告</button>
</div>

<section id="report" class="rep" aria-live="polite"></section>

<section class="fit" aria-labelledby="fitTitle">
  <h2 id="fitTitle">桌椅高度建議</h2>
  <p class="small">輸入孩子身高即可估算；有量測膝窩高、肘高會更準。再填目前的桌椅高度，就能判斷要不要調整或加腳踏板。</p>
  <div class="fit-form">
    <label class="full">孩子身高（cm）<input id="fitH" type="number" inputmode="decimal" min="90" max="200" step="0.5" placeholder="例如 130"></label>
    <label>目前桌面高（cm）<input id="fitDesk" type="number" inputmode="decimal" min="30" max="110" step="0.5" placeholder="選填"></label>
    <label>目前椅面高（cm）<input id="fitChair" type="number" inputmode="decimal" min="15" max="80" step="0.5" placeholder="選填"></label>
  </div>
  <details>
    <summary>精確量測（選填）</summary>
    <p class="small">孩子赤腳（或穿平常在家的拖鞋）坐在硬椅上，大腿水平、小腿垂直、雙腳平踩地面。</p>
    <div class="fit-form">
      <label>膝窩高：地面到膝蓋後窩（cm）<input id="fitPop" type="number" inputmode="decimal" min="15" max="60" step="0.5" placeholder="選填"></label>
      <label>坐姿肘高：椅面到手肘下緣（cm）<input id="fitElb" type="number" inputmode="decimal" min="8" max="40" step="0.5" placeholder="選填"></label>
    </div>
    <p class="small">量肘高時，肩膀放鬆、上臂自然下垂、手肘彎 90°。</p>
  </details>
  <div id="fitResult" aria-live="polite"><p class="small">請先輸入身高。</p></div>
</section>

<section class="exlib" aria-labelledby="exlibTitle">
  <h2 id="exlibTitle">矯正運動教學</h2>
  <button class="primary" id="dailyBtn">▶ 跟著做每日 5 分鐘矯正操</button>
  <div class="exgrid" id="exGrid"></div>
</section>

<div id="tut" class="tut" hidden role="dialog" aria-modal="true" aria-labelledby="tutName">
  <div class="tut-box">
    <div class="tut-head">
      <h2 id="tutName"></h2>
      <span id="tutSeq" class="small"></span>
      <button id="tutMute" aria-pressed="false">🔊</button>
      <button id="tutClose" aria-label="關閉">✕</button>
    </div>
    <span id="tutDose" class="dose"></span>
    <div class="tut-fig" id="tutFig"></div>
    <div class="tut-timer" id="tutTimer"></div>
    <div class="tut-cue" id="tutCue" aria-live="polite"></div>
    <ol id="tutSteps" class="tut-steps"></ol>
    <p class="small">動作要慢、不憋氣，不應該痛；有疼痛或麻就停止。</p>
    <div class="tut-btns"><button class="primary" id="tutGo">▶ 跟著做</button><button id="tutStop" disabled>停止</button></div>
  </div>
</div>

<script type="module">
import { PoseLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $ = id => document.getElementById(id);
const video=$("video"), canvas=$("canvas"), ctx=canvas.getContext("2d");
const I={nose:0,lEye:2,rEye:5,lEar:7,rEar:8,lSh:11,rSh:12,lHip:23,rHip:24};

/* 指標定義：thr=[良好上限, 注意上限]，dir=1 數值越大越差；dir=-1 數值越小越差 */
const METRICS={
  neck:  {label:"頸部前傾",view:"side", unit:"°",thr:[20,35],dir:1},
  trunk: {label:"軀幹前傾",view:"side", unit:"°",thr:[15,30],dir:1},
  sh:    {label:"肩膀高低",view:"front",unit:"°",thr:[4,8],  dir:1},
  tilt:  {label:"頭部側歪",view:"front",unit:"°",thr:[6,12], dir:1},
  drop:  {label:"頭部低垂",view:"front",unit:"", thr:[0.35,0.2],dir:-1},
};
/* 矯正運動：溫和、無器材、適合國小學童；動作以不痛為原則
   type reps：做 reps 次，每次維持 hold 秒（0 = 節奏動作）；type hold：維持 sec 秒 × sets 次（sides 為左右各做） */
const EX={
  chin:{name:"烏龜縮頭（收下巴）",dose:"10 次 × 停 5 秒",how:"坐直眼睛看前方，下巴水平往後收，像做出雙下巴，後頸會感覺被拉長。不要低頭。",
    steps:["坐直或站直，眼睛看正前方","下巴水平往後收，像烏龜把頭縮進殼裡","後脖子會感覺被拉長，眼睛不要往下看"],type:"reps",reps:10,hold:5},
  wall:{name:"貼牆站",dose:"30 秒 × 2 次",how:"腳跟離牆約一個拳頭，後腦、肩胛、屁股貼牆，下巴微收，保持正常呼吸。",
    steps:["背對牆壁站，腳跟離牆一個拳頭","後腦勺、肩膀、屁股都貼到牆","下巴微微收，肩膀放鬆，正常呼吸"],type:"hold",sec:30,sets:2},
  angel:{name:"牆壁天使",dose:"8 次",how:"貼牆站好，手臂彎成「W」貼牆，慢慢往上滑成「Y」再滑回來，手背盡量不離開牆。",
    steps:["貼牆站好，手臂彎成英文字母 W","手背和手肘貼著牆，慢慢往上滑成 Y","再慢慢滑回 W，背不要離開牆"],type:"reps",reps:8,hold:0,tempo:2000},
  cat:{name:"貓牛式",dose:"8 次",how:"四足跪姿，吸氣時抬頭、腰往下沉（牛），吐氣時低頭、背拱起來（貓），動作放慢。",
    steps:["雙手雙膝跪在地上，手在肩膀正下方","吸氣，抬頭看前面，肚子往下沉，這是小牛","吐氣，低頭看肚子，背拱起來，這是小貓"],type:"reps",reps:8,hold:0,tempo:2500,cues:["吸氣，抬頭，肚子往下","吐氣，低頭，背拱起來"]},
  superman:{name:"超人飛飛",dose:"5 次 × 停 5 秒",how:"趴在地上，雙手往前伸直，手腳同時微微抬離地面，眼睛看地板，不要抬頭。",
    steps:["趴在地上，雙手往前伸直","手和腳一起輕輕抬起來，像超人在飛","眼睛看地板，脖子不要往後仰"],type:"reps",reps:5,hold:5},
  shrug:{name:"聳肩放下",dose:"10 次",how:"肩膀用力往上提到耳朵，停 2 秒，再往後、往下放鬆。",
    steps:["站好，手自然放下","肩膀用力往上提，靠近耳朵","停一下，再往後、往下放鬆"],type:"reps",reps:10,hold:2},
  side:{name:"側邊伸展",dose:"每邊 15 秒 × 2 次",how:"坐或站，一手舉高往對側彎，感覺身體側邊拉長，換邊。",
    steps:["站好，一隻手舉高","身體慢慢往另一邊彎","感覺身體側邊被拉長，停住不要晃"],type:"hold",sec:15,sets:2,sides:["右邊","左邊"]},
  neckside:{name:"耳朵找肩膀",dose:"每邊 15 秒",how:"肩膀不動，頭慢慢往一側倒，耳朵靠近肩膀，輕輕停住再換邊，不要用手拉。",
    steps:["坐好，肩膀放鬆不要動","頭慢慢往一邊倒，耳朵靠近肩膀","輕輕停住，不要用手拉"],type:"hold",sec:15,sets:1,sides:["右邊","左邊"]},
  finger:{name:"手指操",dose:"各 10 次",how:"手指用力張開再握拳；拇指依序碰食指到小指；用曬衣夾夾物或捏黏土，訓練握筆的指力。",
    steps:["雙手伸到前面","手指用力張開，越開越好","再用力握拳，換著做"],type:"reps",reps:10,hold:0,tempo:1200},
};

/* 火柴人圖：A = 起始姿勢，B = 動作姿勢（側面人物面向右） */
const FRONT_A={head:[60,20],neck:[60,32],hip:[60,66],sh:[[48,36],[72,36]],arms:[[[46,52],[46,68]],[[74,52],[74,68]]],legs:[[[54,89],[54,111]],[[66,89],[66,111]]]};
const SIDE_A={head:[62,20],neck:[60,32],hip:[58,66],arms:[[[60,50],[64,64]]],legs:[[[58,89],[58,111]]]};
const POSE={
  chin:[{...SIDE_A,head:[69,23]},{...SIDE_A,head:[58,19]}],
  wall:[{head:[58,20],neck:[56,32],hip:[55,66],arms:[[[56,50],[58,66]]],legs:[[[56,89],[60,111]]],wall:50},
        {head:[58,20],neck:[56,32],hip:[55,66],arms:[[[56,50],[58,66]]],legs:[[[56,89],[60,111]]],wall:50}],
  angel:[{...FRONT_A,arms:[[[36,42],[36,26]],[[84,42],[84,26]]]},{...FRONT_A,arms:[[[42,20],[36,6]],[[78,20],[84,6]]]}],
  cat:[{head:[30,60],neck:[42,72],mid:[62,86],hip:[84,72],arms:[[[42,90],[42,110]]],legs:[[[84,110],[106,110]]]},
       {head:[32,86],neck:[42,74],mid:[62,52],hip:[84,74],arms:[[[42,92],[42,110]]],legs:[[[84,110],[106,110]]]}],

            {head:[22,97],neck:[31,103],hip:[72,106],arms:[[[18,98],[6,92]]],legs:[[[92,102],[112,96]]]}],

const SNAP_W=480, BASE_W=640, RAND_K=3;
const snaps={};
const randGap=()=>15000+Math.random()*45000; /* 每 15–60 秒抽一張候選 */
function resetSnaps(){ Object.assign(snaps,{worst:null,last:null,rand:[],seen:0,lastValues:null,lastWorstAt:0,nextRand:performance.now()+randGap()}); }

function grab(values,view,lm){
  const w=BASE_W, h=Math.round(w*video.videoHeight/video.videoWidth)||480;
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  c.getContext("2d").drawImage(video,0,0,w,h);
  return {base:c,lm:lm.map(l=>({x:l.x,y:l.y,v:l.visibility??1})),mirror:video.classList.contains("mirror"),
    t:performance.now()-state.startTime,values:{...values},view};
}
function frameScore(values){
  let sc=0;
  for(const k in values){ const lv=level(k,values[k]); if(lv!=="good") sc+=(lv==="bad"?2:0.5)+Math.max(0,severity(k,values[k])); }
  return sc;
}
function trackSnaps(values,view,lm){
  const now=performance.now();
  snaps.lastValues={values:{...values},view,lm};
  const sc=frameScore(values);
  if(sc>0&&sc>(snaps.worst?.score??0)*1.05&&now-snaps.lastWorstAt>1000&&now-state.startTime>3000){
    snaps.lastWorstAt=now; snaps.worst={...grab(values,view,lm),score:sc};
  }
  if(now>=snaps.nextRand){ /* 蓄水池抽樣：整段偵測中平均隨機留下 RAND_K 張 */
    snaps.nextRand=now+randGap(); snaps.seen++;
    const shot=grab(values,view,lm);
    if(snaps.rand.length<RAND_K) snaps.rand.push(shot);
    else{ const j=Math.floor(Math.random()*snaps.seen); if(j<RAND_K) snaps.rand[j]=shot; }
  }
}

function headCircle(pts,H){
  const face=pts.slice(0,11).filter(q=>q.v>0.3);
  if(!face.length) return null;
  const cx=face.reduce((a,q)=>a+q.x,0)/face.length, cy=face.reduce((a,q)=>a+q.y,0)/face.length;
  const spread=Math.max(...face.map(q=>Math.hypot(q.x-cx,q.y-cy)));
  const [ls,rs,lh,rh]=[pts[11],pts[12],pts[23],pts[24]];
  const torso=ls.v>0.5&&lh.v>0.5?Math.hypot((ls.x+rs.x-lh.x-rh.x)/2,(ls.y+rs.y-lh.y-rh.y)/2):0;
  const r=Math.max(spread*2,torso*0.3,H*0.07);
  return {x:cx,y:cy-r*0.1,r};
}
function pixelate(g,src,{x,y,r}){
  const bx=Math.max(0,x-r), by=Math.max(0,y-r), bw=Math.min(src.width,x+r)-bx, bh=Math.min(src.height,y+r)-by;
  if(bw<=0||bh<=0) return;
  const t=document.createElement("canvas"), blk=Math.max(4,r/3.5);
  t.width=Math.max(1,Math.ceil(bw/blk)); t.height=Math.max(1,Math.ceil(bh/blk));
  t.getContext("2d").drawImage(src,bx,by,bw,bh,0,0,t.width,t.height);
  g.save(); g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.clip();
  g.imageSmoothingEnabled=false; g.drawImage(t,0,0,t.width,t.height,bx,by,bw,bh); g.restore();
}
function renderSnap(sn,opt){
  const B=sn.base, W=B.width, H=B.height;
  const pts=sn.lm.map(l=>({x:(sn.mirror?1-l.x:l.x)*W,y:l.y*H,v:l.v}));
  const full=document.createElement("canvas"); full.width=W; full.height=H; const g=full.getContext("2d");
  g.save(); if(sn.mirror){ g.translate(W,0); g.scale(-1,1); } g.drawImage(B,0,0); g.restore();
  const head=headCircle(pts,H);
  if(opt.blur&&head) pixelate(g,full,head);
  /* 骨架 */
  g.lineWidth=Math.max(2,W/160); g.strokeStyle="#F2C230"; g.lineCap="round";
  for(const c of PoseLandmarker.POSE_CONNECTIONS||[]){
    if(c.start>24||c.end>24) continue; const a=pts[c.start], b=pts[c.end];
    if(a.v>0.5&&b.v>0.5){ g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.stroke(); }
  }
  g.fillStyle="#fff"; g.strokeStyle="#1F3A5F"; g.lineWidth=Math.max(1.5,W/320);
  pts.slice(0,25).forEach((q,i)=>{ if(q.v>0.5&&!(opt.blur&&i>0&&i<11)){ g.beginPath(); g.arc(q.x,q.y,Math.max(2.5,W/180),0,Math.PI*2); g.fill(); g.stroke(); } });
  /* 裁切人物範圍 */
  let [x0,y0,x1,y1]=[0,0,W,H];
  if(opt.crop){
    const vis=pts.slice(0,25).filter(q=>q.v>0.5);
    if(head) vis.push({x:head.x-head.r,y:head.y-head.r},{x:head.x+head.r,y:head.y+head.r});
    if(vis.length>=3){
      x0=Math.min(...vis.map(q=>q.x)); x1=Math.max(...vis.map(q=>q.x));
      y0=Math.min(...vis.map(q=>q.y)); y1=Math.max(...vis.map(q=>q.y));
      const m=Math.max(x1-x0,y1-y0)*0.15;
      x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(W,x1+m); y1=Math.min(H,y1+m);
      if(x1-x0<W*0.2||y1-y0<H*0.2) [x0,y0,x1,y1]=[0,0,W,H];
    }
  }
  const out=document.createElement("canvas"); out.width=SNAP_W; out.height=Math.round(SNAP_W*(y1-y0)/(x1-x0));
  out.getContext("2d").drawImage(full,x0,y0,x1-x0,y1-y0,0,0,out.width,out.height);
  return out.toDataURL("image/jpeg",0.82);
}

function detectView(p){
  const sel=$("viewSel").value; if(sel!=="auto") return sel;
  const shW=Math.abs(p[I.lSh].x-p[I.rSh].x);
  const midY=(p[I.lSh].y+p[I.rSh].y)/2;
  const neckH=Math.max(1,Math.abs(midY-p[I.nose].y));
  return shW/neckH>0.9?"front":"side";
}

function compute(p,view){
  const out={}; const vis=i=>p[i].v>0.5;
  if(view==="side"){
    const L=p[I.lEar].v+p[I.lSh].v, R=p[I.rEar].v+p[I.rSh].v;
    const [ear,sh,hip]=L>=R?[I.lEar,I.lSh,I.lHip]:[I.rEar,I.rSh,I.rHip];
    if(vis(ear)&&vis(sh)) out.neck=deg(Math.atan2(Math.abs(p[ear].x-p[sh].x),p[sh].y-p[ear].y));
    if(vis(sh)&&vis(hip)) out.trunk=deg(Math.atan2(Math.abs(p[sh].x-p[hip].x),p[hip].y-p[sh].y));
  }else{
    if(vis(I.lSh)&&vis(I.rSh)){
      const dx=p[I.lSh].x-p[I.rSh].x, dy=p[I.lSh].y-p[I.rSh].y;
      out.sh=deg(Math.atan2(Math.abs(dy),Math.abs(dx)));
      if(vis(I.nose)) out.drop=((p[I.lSh].y+p[I.rSh].y)/2-p[I.nose].y)/Math.hypot(dx,dy);
    }
    if(vis(I.lEye)&&vis(I.rEye)){
      const dx=p[I.lEye].x-p[I.rEye].x, dy=p[I.lEye].y-p[I.rEye].y;
      out.tilt=deg(Math.atan2(Math.abs(dy),Math.abs(dx)));
    }
  }
  for(const k in out){ const prev=state.ema[k]; state.ema[k]=prev==null?out[k]:prev*0.7+out[k]*0.3; out[k]=state.ema[k]; }
  return out;
}

function handleAlert(values){
  if(tut.open) return;
  const bad=Object.keys(values).filter(k=>level(k,values[k])==="bad")
    .sort((a,c)=>severity(c,values[c])-severity(a,values[a]));
  const b=$("banner"); const now=performance.now();
  if(now-state.lastBreak>BREAK_MS){ state.lastBreak=now; notify("break"); }
  if(!bad.length){
    state.badSince=null; b.style.display="none";
    state.goodSince ??= now;
    if(state.alerted && now-state.goodSince>2000){ state.alerted=false; notify("praise"); }
    return;
  }
  state.goodSince=null;
  state.badSince ??= now;
  if(now-state.badSince>3000){
    b.textContent=withName("請調整：")+bad.map(k=>METRICS[k].label).join("、");
    b.style.display="block";
    if(now-state.lastAlert>12000){ state.lastAlert=now; state.alerted=true; notify(bad[0]); }
  }
}

    state.lastTs=video.currentTime;
    const res=state.landmarker.detectForVideo(video,performance.now());
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(res.landmarks?.length){
      const lm=res.landmarks[0];
      const p=lm.map(l=>({x:l.x*canvas.width,y:l.y*canvas.height,v:l.visibility??1}));
      const view=detectView(p);
      $("viewtag").textContent=view==="side"?"側面":"正面";
      const values=compute(p,view);
      const du=new DrawingUtils(ctx);
      du.drawConnectors(lm,PoseLandmarker.POSE_CONNECTIONS.filter(c=>c.start<25&&c.end<25),{color:"#F2C230",lineWidth:4});
      du.drawLandmarks(lm.slice(0,25),{color:"#1F3A5F",fillColor:"#fff",radius:3});
      state.frames++;
      for(const k in values) state.stats[k][level(k,values[k])]++;
      renderMetricCards(values,view);
      handleAlert(values);
      trackSnaps(values,view,lm);
    }else{
      $("viewtag").textContent="找不到人";
    }
  }
  requestAnimationFrame(loop);
}

async function start(){
  if(state.alertMode==="voice") speak(withName(pick(VOICE.start))); /* 需在點擊當下呼叫，iOS 才會解鎖語音 */

    await startCamera();

/* ===== 桌椅高度建議 =====
   椅面 ≈ 膝窩高 − 1 cm（估算：身高 × 0.25，大腿下方不受壓）
   桌椅高差 ≈ 坐姿肘高 + 2 cm（估算：身高 × 0.135，前臂可平放桌面）
   椅子為了配合桌子而高過膝窩高時，用腳踏板補足雙腳離地的距離 */
const FIT_IDS=["fitH","fitDesk","fitChair","fitPop","fitElb"];
const fit={summary:""};
const num=id=>{ const v=parseFloat($(id).value); return Number.isFinite(v)&&v>0?v:null; };
const r1=v=>Math.round(v*2)/2;
const cm=v=>`${r1(v)} cm`;
function fitCalc(){
  const H=num("fitH"), desk=num("fitDesk"), chair=num("fitChair");
  if(!H||H<90||H>200) return null;
  const pop=num("fitPop")??H*0.25, elb=num("fitElb")??H*0.135;
  const S=pop-1, diff=elb+2, D=S+diff;
  const acts=[];
  let chairF=desk!=null?desk-diff:chair!=null?chair:S;
  let raiseDesk=0;
  if(chairF<S-3){
    if(desk!=null) raiseDesk=S+diff-desk;
    chairF=S;
  }
  const deskF=chairF+diff;
  const foot=chairF-S>2?chairF-S:0;
  if(raiseDesk>0) acts.push(`桌子偏低：書桌墊高約 ${cm(raiseDesk)}（桌腳增高墊或桌上型增高架），或改用斜面寫字板，避免彎腰低頭。`);
  if(chair!=null){
    const d=chairF-chair;
    if(d>1.5) acts.push(`椅子調高 ${cm(d)}，不能調就加硬一點的坐墊。`);
    else if(d<-1.5) acts.push(`椅子調低 ${cm(-d)}${foot?"":"，讓雙腳能平踩地面"}；不能調就換椅子${desk!=null?"或調整桌高":""}。`);
    else acts.push("椅子高度合適，維持現狀。");
  }
  if(foot) acts.push(`需要腳踏板，高度約 ${cm(foot)}：踏面要能放雙腳、止滑、穩固不晃，坐下時膝約 90°、大腿與椅面平貼。${foot>15?"超過 15 cm 上下椅子不方便，建議優先降低桌面或改用可調高度的兒童書桌。":""}`);
  else acts.push("雙腳能平踩地面，不需要腳踏板。");
  if(desk==null&&chair==null) acts.push("填入目前桌椅高度，可判斷要調哪一邊。");
  acts.push(`坐深：坐滿椅面時膝窩與椅子前緣留 2–3 指寬；太深就在背後加靠墊。`);
  return {H,S,D,diff,chairF,deskF,foot,acts,est:num("fitPop")==null||num("fitElb")==null};
}
function fitSVG(o){
  const k=1.25, F=132, sy=F-o.chairF*k, dy=F-o.deskF*k, fy=F-o.foot*k;
  const hip=[66,sy-3], knee=[104,sy-3], sh=[64,sy-3-o.H*0.2*k], elb=[74,sy-3-o.diff*k+6];
  const hand=[118,dy-3], head=[70,sh[1]-o.H*0.07*k];
  let g=`<line class="fur" x1="4" y1="${F}" x2="196" y2="${F}"/>`;
  g+=`<line class="fur" x1="44" y1="${sy}" x2="94" y2="${sy}"/><line class="fur" x1="46" y1="${sy}" x2="46" y2="${F}"/><line class="fur" x1="92" y1="${sy}" x2="92" y2="${F}"/><line class="fur" x1="46" y1="${sy}" x2="44" y2="${sy-48}"/>`;
  g+=`<line class="fur" x1="100" y1="${dy}" x2="196" y2="${dy}"/><line class="fur" x1="190" y1="${dy}" x2="190" y2="${F}"/>`;
  if(o.foot) g+=`<rect class="fr" x="96" y="${fy}" width="30" height="${o.foot*k}" rx="2"/><text x="128" y="${fy+o.foot*k/2+3}">腳踏板 ${r1(o.foot)}</text>`;
  g+=L(hip,sh)+L(sh,elb)+L(elb,hand)+L(hip,knee)+L(knee,[104,fy])+L([104,fy],[114,fy]);
  g+=`<circle cx="${head[0]}" cy="${head[1]}" r="9"/>`;
  g+=`<text x="6" y="${sy-4}">椅 ${r1(o.chairF)}</text><text x="150" y="${dy-4}">桌 ${r1(o.deskF)}</text>`;
  const top=Math.min(head[1]-12,dy-14);
  return `<svg viewBox="0 ${top} 200 ${F+4-top}" role="img" aria-label="建議坐姿示意：椅面 ${r1(o.chairF)} 公分，桌面 ${r1(o.deskF)} 公分${o.foot?`，腳踏板 ${r1(o.foot)} 公分`:""}">${g}</svg>`;
}
function renderFit(){
  const o=fitCalc(), out=$("fitResult");
  try{ localStorage.setItem("postureFit",JSON.stringify(Object.fromEntries(FIT_IDS.map(i=>[i,$(i).value])))); }catch{}
  if(!o){ fit.summary=""; out.innerHTML=`<p class="small">${num("fitH")?"身高請輸入 90–200 cm。":"請先輸入身高。"}</p>`; return; }
  fit.summary=`建議椅面 ${cm(o.chairF)}、桌面 ${cm(o.deskF)}，${o.foot?`需要約 ${cm(o.foot)} 的腳踏板`:"不需要腳踏板"}；雙腳平踩、膝約 90°，前臂平放桌面、肩膀不聳起。`;
  out.innerHTML=`<div class="fit-out">
      <div class="m good"><div class="k">建議椅面高</div><div class="v">${cm(o.chairF)}</div></div>
      <div class="m good"><div class="k">建議桌面高</div><div class="v">${cm(o.deskF)}</div></div>
      <div class="m ${o.foot?"warn":"good"}"><div class="k">腳踏板</div><div class="v">${o.foot?cm(o.foot):"不需要"}</div></div>
    </div>
    <div class="fit-fig">${fitSVG(o)}</div>
    <ul>${o.acts.map(a=>`<li>${a}</li>`).join("")}</ul>
    <p class="small">理想組合（雙腳著地、不用腳踏板）：椅面 ${cm(o.S)}、桌面 ${cm(o.D)}，桌椅高差 ${cm(o.diff)}。${o.est?"未填精確量測的部分以身高比例估算，個別差異約 ±2 cm，請以孩子實際坐姿微調。":""}孩子長高後請重新量測。</p>`;
}
try{ const s=JSON.parse(localStorage.getItem("postureFit")||"{}"); FIT_IDS.forEach(i=>{ if(s[i]) $(i).value=s[i]; }); }catch{}
FIT_IDS.forEach(i=>$(i).addEventListener("input",renderFit));
renderFit();

/* ===== 運動教學 ===== */
const tut={open:false,running:false,abort:false,mute:false,preview:null,keys:[]};
const chk=()=>{ if(tut.abort) throw "abort"; };
const sleep=ms=>new Promise(r=>setTimeout(r,ms)).then(chk);
function sayNow(text){
  if(tut.mute||!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang=state.voice?.lang||"zh-TW"; if(state.voice) u.voice=state.voice; u.rate=0.95; u.pitch=1.1;
  speechSynthesis.speak(u); return u;
}
function say(text){
  $("tutCue").textContent=text;
  return new Promise(res=>{
    const fb=setTimeout(res,700+text.length*260);
    const u=sayNow(text);
    if(u){ u.onend=u.onerror=()=>{ clearTimeout(fb); res(); }; }
  }).then(chk);
}
const setPose=b=>$("tutFig").querySelector(".fig")?.classList.toggle("b",b);
function startPreview(){ stopPreview(); let b=false; tut.preview=setInterval(()=>setPose(b=!b),1300); }
function stopPreview(){ clearInterval(tut.preview); tut.preview=null; setPose(false); }
const NUM="零一二三四五六七八九十";
async function hold(sec,countUp){
  for(let t=1;t<=sec;t++){
    $("tutTimer").textContent=sec-t+1;
    if(countUp) sayNow(NUM[t]||String(t));
    else if(sec-t+1===10) sayNow("還有十秒");
    else if(sec-t+1<=3) sayNow(NUM[sec-t+1]);
    await sleep(1000);
  }
  $("tutTimer").textContent="";
}
async function doEx(k){
  const e=EX[k];
  if(e.type==="reps"){
    for(let r=1;r<=e.reps;r++){
      $("tutCue").textContent=`第 ${r} 次，共 ${e.reps} 次`;
      setPose(true);
      if(e.cues&&r<=2) await say(e.cues[0]);
      if(e.hold){ await hold(e.hold,true); } else await sleep(e.tempo/2);
      setPose(false);
      if(e.cues&&r<=2) await say(e.cues[1]);
      else if(e.hold){ await say("放鬆"); await sleep(800); }
      else { sayNow(String(r)); await sleep(e.tempo/2); }
    }
  }else{
    const sides=e.sides||[""];
    for(const [si,side] of sides.entries()) for(let n=1;n<=e.sets;n++){
      await say(side?(e.sets>1?`${side}，第${n}次`:side):(e.sets>1?`第${n}次`:"開始"));
      setPose(true); await hold(e.sec,false); setPose(false);
      if(n<e.sets||si<sides.length-1){ await say("放鬆休息一下"); await sleep(3000); }
    }
  }
}
function showEx(k,seq=""){
  const e=EX[k];
  $("tutName").textContent=e.name; $("tutDose").textContent=e.dose; $("tutSeq").textContent=seq;
  $("tutFig").innerHTML=figSVG(k);
  $("tutSteps").innerHTML=e.steps.map(t=>`<li>${t}</li>`).join("");
  $("tutTimer").textContent=""; $("tutCue").textContent="";
}
const hlStep=i=>[...$("tutSteps").children].forEach((li,j)=>li.classList.toggle("on",j===i));
function openTut(keys){
  tut.keys=keys; tut.open=true; tut.abort=false;
  showEx(keys[0],keys.length>1?`共 ${keys.length} 個動作`:"");
  $("tut").hidden=false; $("tutGo").disabled=false; $("tutStop").disabled=true;
  $("banner").style.display="none";
  startPreview(); $("tutGo").focus();
}
function closeTut(){
  tut.abort=true; tut.open=false; stopPreview();
  if("speechSynthesis" in window) speechSynthesis.cancel();
  $("tut").hidden=true;
}
async function runTut(){
  const keys=tut.keys; tut.abort=false; tut.running=true; stopPreview();
  $("tutGo").disabled=true; $("tutStop").disabled=false;
  try{
    for(const [i,k] of keys.entries()){
      showEx(k,keys.length>1?`第 ${i+1} / ${keys.length} 個`:"");
      await say(EX[k].name);
      for(const [j,t] of EX[k].steps.entries()){ hlStep(j); await say(t); }
      hlStep(-1);
      await say(i===0?withName("準備，開始"):"準備，開始");
      await doEx(k);
      if(i<keys.length-1){ await say("做得好，下一個動作"); await sleep(1500); }
    }
    await say(withName(keys.length>1?"全部完成，你做得很棒！":"完成，做得很好！"));
  }catch(err){ if(err!=="abort") console.error(err); }
  finally{
    tut.running=false; $("tutTimer").textContent="";
    if(tut.open){ $("tutGo").disabled=false; $("tutStop").disabled=true; $("tutGo").textContent="▶ 再做一次"; showEx(keys[0],keys.length>1?`共 ${keys.length} 個動作`:""); startPreview(); }
  }
}
$("exGrid").innerHTML=Object.keys(EX).map(k=>`<button class="excard" data-ex="${k}">${figSVG(k)}<span class="n">${EX[k].name}</span><span class="d">${EX[k].dose}</span></button>`).join("");
document.addEventListener("click",e=>{ const b=e.target.closest("[data-ex]"); if(b){ $("tutGo").textContent="▶ 跟著做"; openTut([b.dataset.ex]); } });
$("dailyBtn").onclick=()=>{ $("tutGo").textContent="▶ 跟著做"; openTut(EX_DAILY); };
$("tutGo").onclick=runTut;
$("tutStop").onclick=()=>{ tut.abort=true; if("speechSynthesis" in window) speechSynthesis.cancel(); $("tutCue").textContent="已停止"; };
$("tutClose").onclick=closeTut;
$("tut").addEventListener("click",e=>{ if(e.target.id==="tut") closeTut(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&tut.open) closeTut(); });
$("tutMute").onclick=e=>{ tut.mute=!tut.mute; e.target.textContent=tut.mute?"🔇":"🔊"; e.target.setAttribute("aria-pressed",tut.mute); if(tut.mute&&"speechSynthesis" in window) speechSynthesis.cancel(); };

function pdfCopy(){ /* 固定 720px 寬的副本，PDF 版面不受手機螢幕寬度影響 */
  const el=document.createElement("div"); el.className="rep pdf";
  el.innerHTML=$("report").innerHTML;
  el.querySelectorAll("[data-html2canvas-ignore]").forEach(n=>n.remove());
  return el;
}
const loadScript=src=>new Promise((ok,ng)=>{ const el=document.createElement("script"); el.src=src; el.onload=ok; el.onerror=ng; document.head.appendChild(el); });
async function downloadPdf(btn){
  btn.disabled=true; btn.textContent="產生 PDF 中…";
  const root=document.documentElement, prevTheme=root.getAttribute("data-theme");
  try{
    if(!window.html2pdf) await loadScript("https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js");
    root.setAttribute("data-theme","light"); /* PDF 一律用淺色 */
    const d=state.reportAt||new Date(), p2=n=>String(n).padStart(2,"0");
    const who=nick().replace(/[\\/:*?"<>|\s]/g,"");
    await html2pdf().set({
      margin:[10,10,12,10],
      filename:`寫字姿勢報告${who?"_"+who:""}_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.pdf`,
      image:{type:"jpeg",quality:0.92},
      html2canvas:{scale:2,backgroundColor:"#ffffff",scrollX:0,scrollY:0},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["avoid-all","css"]},
    }).from(pdfCopy()).save();
  }catch(e){
    console.error(e);
    alert("PDF 產生失敗，將改用列印：請在列印畫面選擇「另存為 PDF」。");
    window.print();
  }finally{
    prevTheme==null?root.removeAttribute("data-theme"):root.setAttribute("data-theme",prevTheme);
    btn.disabled=false; btn.textContent="下載 PDF";
  }
}
$("report").addEventListener("click",e=>{ if(e.target.id==="pdfBtn") downloadPdf(e.target); });
$("report").addEventListener("change",e=>{
  if(e.target.id!=="optCrop"&&e.target.id!=="optBlur") return;
  snapOpt.crop=$("optCrop").checked; snapOpt.blur=$("optBlur").checked;
  try{ localStorage.setItem("postureSnapOpt",JSON.stringify(snapOpt)); }catch{}
  refreshSnapImgs();
});

$("reportBtn").onclick=()=>state.frames?report():null;
$("flipBtn").onclick=async()=>{
  const prev=state.facing, prevId=cam.deviceId;
  state.facing=prev==="user"?"environment":"user"; state.ema={};
  if(!MOBILE&&cam.list.length>=2){ /* 電腦：輪流使用下一支鏡頭 */
    const i=cam.list.findIndex(d=>d.deviceId===cam.deviceId);
    cam.deviceId=cam.list[(i+1)%cam.list.length].deviceId;
  }
  if(!state.running) return;
  $("flipBtn").disabled=true;
  try{
    const before=cam.cur;
    await startCamera();
    /* 有些手機不回報鏡頭方向，切換後若還是同一支鏡頭，就直接換下一支 */
    if(MOBILE&&cam.cur&&cam.cur===before&&cam.list.length>=2){
      const i=cam.list.findIndex(d=>d.deviceId===cam.cur);
      cam.deviceId=cam.list[(i+1)%cam.list.length].deviceId;
      await startCamera();
    }
  }
  catch{ state.facing=prev; cam.deviceId=prevId; try{ await startCamera(); }catch{} alert("無法切換鏡頭，這台裝置可能只有一支鏡頭。"); }
  finally{ $("flipBtn").disabled=false; }
};
navigator.mediaDevices?.addEventListener?.("devicechange",refreshCams);
refreshCams();
$("alertSel").onchange=e=>{ state.alertMode=e.target.value; if(state.alertMode!=="voice"&&"speechSynthesis" in window) speechSynthesis.cancel(); };
$("testVoiceBtn").onclick=()=>{
  if(!speak(withName(pick(VOICE.neck)))){ alert("此瀏覽器不支援語音，請改用 Chrome 或 Safari。"); return; }
  if(!state.voice) setTimeout(()=>{ if(!state.voice) $("testVoiceBtn").textContent="試聽（未找到中文語音）"; },500);
};
$("viewSel").onchange=()=>{ state.ema={}; };
</script>
</body>
