<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>期中考總復習</title>
<meta name="description" content="一年級期中評量總複習：照老師發的國語、數學參考題型一大題一大題練習，注音照考卷直式排版。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 版面：像老師發的那疊複習講義，一張一張「紙」；國語葉子綠、數學地瓜橘。注音照考卷直式排：符號由上往下，聲調在最後一個符號的右上方，輕聲點在最上面 */
:root{
  --bg:#F3EDDF; --paper:#FFFDF8; --ink:#22303A; --muted:#5E6A73; --line:#DCD2BD; --soft:#F2EBDB;
  --zh:#2F8F5E; --zh-soft:#DDF0E4; --ma:#C97520; --ma-soft:#FBE6CF;
  --red:#D2352C; --ok:#2F8F5E; --ok-soft:#DDF0E4; --star:#E9A800; --brave:#3C8DBF; --hint:#FFF3D1; --hint-ink:#6A4B00;
  --cell:#CFE9F7; --cell-ink:#1F5E80; --gray:#E3E3E3;
  --f-kai:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#171C1F; --paper:#22292D; --ink:#EAF0F2; --muted:#A9B4BA; --line:#3A464C; --soft:#2B3439;
  --zh:#6CCB98; --zh-soft:#21402F; --ma:#F2A65A; --ma-soft:#43301C;
  --red:#FF7B6E; --ok:#6CCB98; --ok-soft:#21402F; --star:#F5C431; --brave:#7BBDE6; --hint:#3A3015; --hint-ink:#F4DE9C;
  --cell:#1E4357; --cell-ink:#BFE6FA; --gray:#3A4246;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171C1F; --paper:#22292D; --ink:#EAF0F2; --muted:#A9B4BA; --line:#3A464C; --soft:#2B3439;
  --zh:#6CCB98; --zh-soft:#21402F; --ma:#F2A65A; --ma-soft:#43301C;
  --red:#FF7B6E; --ok:#6CCB98; --ok-soft:#21402F; --star:#F5C431; --brave:#7BBDE6; --hint:#3A3015; --hint-ink:#F4DE9C;
  --cell:#1E4357; --cell-ink:#BFE6FA; --gray:#3A4246;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;
  padding:0 max(16px,env(safe-area-inset-right,0px)) 140px max(16px,env(safe-area-inset-left,0px));-webkit-tap-highlight-color:transparent}
body.padopen{padding-bottom:calc(var(--padh,300px) + 40px)}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 12px;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--star);outline-offset:2px}
button:disabled{cursor:default}
.em{font-family:var(--f-emoji);line-height:1;font-style:normal;display:inline-block}
h1,h2,h3{font-family:var(--f-kai);margin:0;text-wrap:balance}
#app{max-width:900px;margin:0 auto}

/* ---------- 直式注音（排法在 ../zhuyin-layout.js，這裡只調字型與大小） ---------- */
:root{--zy-font:var(--f-kai)}
.zv{font-weight:400}
/* 國字注音：注音直排在國字右邊 */
.tx{font-family:var(--f-kai);line-height:2.3;--zr-size:.46em}
.tx .dg{font-family:var(--f-body);font-weight:500;padding:0 .12em}

/* ---------- 頁首 ---------- */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:8px 0;background:var(--bg)}
.topbar h1{flex:1;min-width:0;font-size:1.25rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{min-width:46px;min-height:46px;padding:4px 8px;font-size:1.2rem;display:grid;place-items:center}
.score{font-size:.9rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.pbar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin:0 0 10px}
.pbar i{display:block;height:100%;width:0;background:var(--zh);transition:width .3s}
.ma .pbar i{background:var(--ma)}

/* ---------- 首頁 ---------- */
.hero{padding:18px 0 6px;display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:2rem;letter-spacing:.06em}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.count{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 4px}
.chip{border-radius:999px;padding:4px 14px;font-weight:700;font-size:.95rem}
.chip.zh{background:var(--zh-soft);color:var(--zh)} .chip.ma{background:var(--ma-soft);color:var(--ma)}
.subjects{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
@media (max-width:720px){.subjects{grid-template-columns:1fr}}
.subj{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px 14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.subj h2{font-size:1.5rem;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.subj.zh h2{color:var(--zh)} .subj.ma h2{color:var(--ma)}
.subj h2 small{font-family:var(--f-body);font-size:.85rem;color:var(--muted);font-weight:500}
.scope{font-size:19px;margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:0 10px}
.scope li{min-width:0}
.scope .ln{color:var(--muted);font-size:15px}
.secs{display:flex;flex-direction:column;gap:8px}
.secbtn{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:8px 10px;min-height:56px}
.secbtn .no{font-family:var(--f-kai);font-weight:700;font-size:1.25rem;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.zh .secbtn .no{background:var(--zh-soft);color:var(--zh)} .ma .secbtn .no{background:var(--ma-soft);color:var(--ma)}
.secbtn .nm{flex:1;min-width:0;font-size:18px;line-height:1.9}
.secbtn .st{flex:none;font-size:.82rem;color:var(--muted);text-align:right;line-height:1.3}
.secbtn .st.done{color:var(--ok);font-weight:700}
.src{font-size:.85rem;color:var(--muted);margin:0}
.card{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:14px;margin-top:16px}
.card h2{font-size:1.2rem;margin-bottom:8px}
.voice{display:flex;flex-direction:column;gap:10px}
.voice .vrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.voice select{font:inherit;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;min-height:46px;padding:6px 10px;flex:1 1 220px;min-width:0;max-width:100%}
.voice .seg{display:flex;gap:6px}
.voice .seg button[aria-pressed="true"]{border-color:var(--zh);background:var(--zh-soft);font-weight:700}
.voice .seg{flex-wrap:wrap}
.vnote{margin:0;font-size:.88rem;color:var(--muted);max-width:62ch}
.vnote.warn{background:var(--hint);color:var(--hint-ink);border-radius:12px;padding:8px 12px}
details.parent summary{cursor:pointer;font-family:var(--f-kai);font-size:1.15rem;font-weight:700;min-height:44px;display:flex;align-items:center}
details.parent ul{margin:6px 0 0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;max-width:66ch}
details.parent li{color:var(--muted)} details.parent li b{color:var(--ink)}

/* ---------- 題目頁 ---------- */
.ins{background:var(--paper);border:2px solid var(--line);border-left:8px solid var(--zh);border-radius:16px;padding:6px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:0 8px;margin-bottom:12px}
.ma .ins{border-left-color:var(--ma)}
.ins .tx{flex:1 1 220px;min-width:0;font-size:23px;font-weight:700}
.ins .say{margin:0 0 6px auto}
.say{flex:none;border-radius:999px;padding:4px 12px;min-height:40px;font-size:.95rem;background:var(--soft);border-color:transparent}
.paper{background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:14px 10px;margin-bottom:14px;position:relative}
.paper>.sub{font-size:20px;margin:0 4px 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pn{font-family:var(--f-kai);font-weight:700;font-size:18px;line-height:1.2}
.exl{display:inline-block;white-space:nowrap;background:var(--muted);color:var(--paper);border-radius:999px;padding:0 8px 0 6px;font-size:15px}
.exl .zv{color:var(--paper)}
.tip{font-size:.85rem;color:var(--muted);margin:2px 4px 8px}

/* 一、看圖選一選 */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:10px;direction:rtl}
.pitem{direction:ltr;border:2px solid var(--line);border-radius:16px;padding:6px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;background:var(--paper)}
.pitem>.pn{position:absolute;top:6px;left:8px}
.pitem.done{border-color:var(--ok)}
.ppic{font-size:2.5rem;min-height:66px;display:grid;place-items:center;line-height:1}
.ppic svg{width:62px;height:62px}
.popts{display:flex;gap:12px;justify-content:center}
.popt{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 6px 10px;min-width:56px;font-size:23px;border:2px solid transparent;background:transparent;border-radius:14px}
.popt:not(:disabled):hover{border-color:var(--line)}
.mk{position:relative;display:grid;place-items:center;width:34px;height:36px;font-size:24px;font-weight:700;line-height:1;font-family:var(--f-body)}
.mk i{font-style:normal;visibility:hidden}
.mk.vp::before,.mk.vp::after{content:"";position:absolute;left:3px;right:3px;height:9px;border:2px solid var(--ink)}
.mk.vp::before{top:0;border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0}
.mk.vp::after{bottom:0;border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%}
.mk.bx{width:30px;height:30px;border:2px solid var(--ink);border-radius:2px;font-size:22px}
.on .mk i{visibility:visible}
.popt.on{background:var(--ok-soft)}
.ex .popt.on{background:transparent}
.ex .mk i{color:var(--red)}
.no{opacity:.4;border-style:dashed!important}
.reveal{box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 55%,transparent)!important;animation:glow 1.2s ease-in-out 2}
@keyframes glow{50%{transform:scale(1.05)}}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 二、圈出正確的拼音（直式句子） */
.sgrid{display:flex;flex-wrap:wrap;flex-direction:row-reverse;justify-content:center;gap:10px}
.scard{border:2px solid var(--line);border-radius:16px;padding:8px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:96px;background:var(--paper)}
.scard.done{border-color:var(--ok)}
.scard .ppic{font-size:2.2rem;min-height:54px}
.vsent{display:flex;flex-direction:row-reverse;align-items:flex-start;gap:16px;font-size:23px}
.vcol{display:flex;flex-direction:column;align-items:center;gap:.55em}
.vpunc{display:block;width:1em;height:1em;line-height:1;text-align:center;font-family:var(--f-kai);position:relative}
.vpunc.colon::before,.vpunc.colon::after{content:"";position:absolute;left:50%;width:.16em;height:.16em;margin-left:-.08em;border-radius:50%;background:currentColor}
.vpunc.colon::before{top:.25em} .vpunc.colon::after{top:.6em}
.ch{display:flex;align-items:center}
.ch.split{flex-direction:row;gap:0}
.ch.split .dl{align-self:stretch;width:0;border-left:2px dotted var(--muted);margin:0 3px}
.ch.paren{flex-direction:column;gap:.1em}
.arc{display:block;width:1.3em;height:.42em;border:2px solid currentColor}
.arc.t{border-bottom:none;border-radius:50% 50% 0 0/100% 100% 0 0}
.arc.b{border-top:none;border-radius:0 0 50% 50%/0 0 100% 100%}
.sl{font-style:normal;font-family:var(--f-kai);line-height:1}
.cho{padding:.25em .12em;border:3px solid transparent;border-radius:999px;background:transparent;font-size:1em;min-width:0}
.cho:not(:disabled):hover{border-color:var(--line)}
.cho.on{border-color:var(--red)}
.ex .cho.on{border-color:var(--red)}

/* 三、造詞 */
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;direction:rtl}
.bitem{direction:ltr;border:2px solid var(--line);border-radius:16px;padding:8px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;background:var(--paper)}
.bitem>.pn{position:absolute;top:6px;left:8px}
.bitem.done{border-color:var(--ok)}
.bq{font-size:28px;margin-top:6px}
.barr{font-size:26px;line-height:1;color:var(--muted)}
.tzs{display:flex;flex-direction:column}
.tz{width:60px;height:60px;border:2px solid var(--ink);margin-top:-2px;display:grid;place-items:center;font-size:17px;color:var(--red);
  background:linear-gradient(var(--line),var(--line)) center/100% 1px no-repeat,linear-gradient(90deg,var(--line),var(--line)) center/1px 100% no-repeat}
.tz .zv.hl{background:color-mix(in srgb,var(--star) 30%,transparent);border-radius:6px}
.bopts{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.bopt{display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px 8px;min-width:44px;font-size:16px;border:2px solid var(--line);border-radius:12px}
.bopt .cn{font-size:15px;font-weight:700;color:var(--muted)}
.bopt .em{font-size:24px}
.bopt.on{border-color:var(--ok);background:var(--ok-soft)}

/* 四、讀句子選答案 */
.qgrid{display:flex;flex-wrap:wrap;flex-direction:row-reverse;justify-content:center;gap:10px}
.qitem{border:2px solid var(--line);border-radius:16px;padding:6px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper)}
.qitem.done{border-color:var(--ok)}
.qhead{display:flex;gap:8px;align-items:center;font-size:20px}
.ansp{font-family:var(--f-kai);font-size:22px}
.ansp b{display:inline-block;min-width:1.6em;text-align:center;color:var(--red)}
.qbody{display:flex;flex-direction:row-reverse;gap:10px;align-items:flex-start}
.qbody .vcol{font-size:22px}
.qopts{display:flex;flex-direction:row-reverse;gap:4px}
.qopt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 2px 8px;min-width:42px;font-size:19px;border:2px solid var(--line);border-radius:12px}
.qopt .cn{font-size:18px;font-family:var(--f-body)}
.qopt.on{border-color:var(--ok);background:var(--ok-soft)}
.b4{display:block;width:1.25em;height:1.25em;border:2px solid var(--ink);margin:.05em 0;display:grid;place-items:center;color:var(--red)}
.b4 .zv{font-size:.62em}

/* 五、連連看 */
.lk{position:relative;display:flex;flex-direction:column;gap:56px;padding:4px 0}
.lrow{display:flex;flex-direction:row-reverse;justify-content:space-around;gap:2px}
.lit{display:flex;flex-direction:column;align-items:center;gap:6px;border:none;background:transparent;padding:4px 2px;min-width:0;flex:1 1 0;border-radius:14px}
.lit .pn{font-size:16px}
.lit .exl{font-size:13px}
.lit .ppic{font-size:2rem;min-height:52px;width:56px;height:56px;border:2px solid var(--ink);border-radius:50%;place-items:center}
.lit .ppic svg{width:40px;height:40px}
.lit .zv{font-size:22px}
.ldot{width:16px;height:16px;border-radius:50%;background:var(--ink);flex:none}
.lit.sel{background:color-mix(in srgb,var(--star) 25%,transparent)}
.lit.sel .ldot{box-shadow:0 0 0 5px color-mix(in srgb,var(--star) 60%,transparent)}
.llines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.llines line{stroke:var(--red);stroke-width:3.5;stroke-linecap:round}
.llines line.rv{stroke:var(--star);stroke-dasharray:7 6}
.lwr{display:flex;flex-direction:column;align-items:center}
.lwr .tz{width:52px;height:56px;font-size:17px}
.tall{width:52px;height:118px;border:2px solid var(--ink);display:flex;flex-direction:column;color:var(--red);font-size:17px}
.tall>span{flex:1;display:grid;place-items:center}
.tall>span+span{border-top:2px dashed var(--line)}

/* 六、聲調 */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;direction:rtl}
.titem{direction:ltr;border:2px solid var(--line);border-radius:16px;padding:6px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;background:var(--paper)}
.titem>.pn{position:absolute;top:6px;left:8px}
.titem .zw{font-size:27px;gap:.45em}
.titem.long .zw{font-size:24px;gap:.3em}
.titem.done{border-color:var(--ok)}
.zv.hb{padding-right:.95em}
.tb{position:absolute;left:100%;top:-.2em;width:.78em;height:.78em;min-height:0;padding:0;border:2px solid var(--red);border-radius:5px;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.tb::before{content:"";position:absolute;inset:-10px}
.tb .tm{position:static;width:.5em;height:.5em;stroke:var(--ok)}
.tb .lt{display:block;width:.2em;height:.2em;border-radius:50%;background:var(--ok)}
.tb.act{box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 60%,transparent)}
.tb.ok{border-color:var(--ok)}
.tb.exm .tm{stroke:var(--red)}
.tb.exm{border-color:var(--red)}

/* ---------- 數學 ---------- */
.mtx{font-size:20px}
.nb{display:inline-grid;place-items:center;min-width:46px;height:40px;padding:0 6px;margin:0 3px;border:2px solid var(--ma);border-radius:10px;
  background:var(--paper);font-family:var(--f-body);font-weight:700;font-size:22px;color:var(--ink);vertical-align:middle;font-variant-numeric:tabular-nums}
.nb .nv:empty::after{content:"？";color:var(--line)}
.nb.act{box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 60%,transparent);border-color:var(--star)}
.nb.ok{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.nb.paren{border:none;border-bottom:3px solid var(--ma);border-radius:6px 6px 2px 2px;min-width:52px}
.nb.paren.ok{border-bottom-color:var(--ok)}
.seq{display:flex;align-items:center;gap:0;margin:8px 0;flex-wrap:nowrap}
.seq .lb{flex:none;width:30px;font-family:var(--f-kai);font-size:16px}
.seq .cl{flex:1 1 0;min-width:0;max-width:64px;height:44px;margin:0;border:2px solid #9aa3a8;display:grid;place-items:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;padding:0}
.seq .cn{flex:0 1 14px;height:2px;background:#9aa3a8;min-width:4px}
.seq.r .cl{border-radius:12px} .seq.c .cl{border-radius:50%;height:44px}
.seq .cl.g{background:var(--cell);color:var(--cell-ink)}
.seq.gray .cl.g{background:var(--gray);color:var(--ink)}
.seq .nb{margin:0;border-color:#9aa3a8;border-width:2px}
.seq .nb.act{border-color:var(--star)}
.seq .nb.ok{border-color:var(--ok)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.mcell{border:2px solid var(--line);border-radius:14px;padding:8px;position:relative;min-height:110px;display:flex;flex-direction:column;align-items:center;gap:6px;background:var(--paper)}
.mcell .cnum{position:absolute;top:6px;left:8px;font-family:var(--f-kai);font-size:18px}
.mcell .nb{position:absolute;top:6px;right:6px;margin:0}
.items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;align-content:center;font-size:28px;padding:30px 4px 0;max-width:240px}
.items.tight{gap:1px}
.blk{filter:brightness(0)} .wht{filter:grayscale(1) brightness(1.7) contrast(.6)}
.cmp{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.cgroup{border:2px dashed var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;flex:1 1 240px;min-width:0}
.cgroup .lab{align-self:flex-start;font-family:var(--f-kai);font-size:16px}
.cpics{display:flex;gap:12px;align-items:flex-end;justify-content:center}

<body>
<main id="app"></main>
<div id="coach" class="coach fade" role="status" aria-live="polite"><span class="tt em">🐢</span><span id="coachText"></span></div>
<div id="pad" class="pad" hidden>
  <div class="pad-in">
    <div class="pad-top"><span id="padTitle">寫數字</span><button type="button" data-act="padx">收起來 ✕</button></div>
    <div class="keys" id="numKeys">
      <button type="button" data-act="key" data-k="1">1</button><button type="button" data-act="key" data-k="2">2</button><button type="button" data-act="key" data-k="3">3</button>
      <button type="button" data-act="key" data-k="4">4</button><button type="button" data-act="key" data-k="5">5</button><button type="button" data-act="key" data-k="6">6</button>
      <button type="button" data-act="key" data-k="7">7</button><button type="button" data-act="key" data-k="8">8</button><button type="button" data-act="key" data-k="9">9</button>
      <button type="button" data-act="key" data-k="bk" aria-label="擦掉">⌫</button><button type="button" data-act="key" data-k="0">0</button><button type="button" class="okk" data-act="key" data-k="ok">好了</button>
    </div>
    <div class="tkeys" id="toneKeys"></div>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script src="../tw-speech.js"></script>
<script src="../zhuyin-layout.js"></script>
<script>
'use strict';
const KID = '大寶';
const VOICE_SAMPLE = `${KID}你好，我是龜龜老師。期中考快到了，我們一起複習，加油喔！`;
// 考試日期（民國 115 年 = 2026 年）
const EXAM = { zh: { d: '2026-11-03', label: '11月3日（星期二）' }, ma: { d: '2026-11-04', label: '11月4日（星期三）' } };

/* ---------- 小工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rep = (s, n) => Array.from({ length: n }, () => s);
const store = {
  get(k, d) { try { const v = localStorage.getItem('mid1:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mid1:' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('mid1:' + k); } catch {} }
};

/* ---------- 聲音（共用 ../tw-speech.js 挑台灣國語語音） ---------- */
let soundOn = store.get('sound', true), zhVoice = null, actx = null, voices = [];
let voicePref = store.get('voice', ''), rate = store.get('rate', 0.88);
const isTW = v => TWSpeech.isTaiwanVoice(v);
function loadVoice() { voices = TWSpeech.chineseVoices(); zhVoice = TWSpeech.pickVoice(voicePref); renderVoicePanel(); }
if ('speechSynthesis' in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function renderVoicePanel() {
  const sel = $('#voiceSel'); if (!sel) return;
  const tw = voices.filter(isTW);
  sel.innerHTML = voices.length
    ? voices.map(v => `<option value="${esc(v.voiceURI)}">${isTW(v) ? '🇹🇼 ' : ''}${esc(v.name)}（${esc(v.lang)}）</option>`).join('')
    : '<option value="">這台裝置沒有中文語音</option>';
  sel.disabled = !voices.length;
  if (zhVoice) sel.value = zhVoice.voiceURI;
  else if (voices.length) sel.insertAdjacentHTML('afterbegin', '<option value="" selected>自動（交給裝置決定）</option>');
  $$('#rateSeg button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.r === rate));
  const note = $('#voiceNote');
  if (!('speechSynthesis' in window)) { note.textContent = '這個瀏覽器不支援朗讀，題目還是可以看著寫。'; note.className = 'vnote warn'; }
  else if (tw.length) { note.textContent = `已找到 ${tw.length} 個台灣國語語音（有 🇹🇼 的），會自動使用。`; note.className = 'vnote'; }
  else { note.textContent = TWSpeech.voiceTip() || '還在讀取語音清單…'; note.className = 'vnote' + (TWSpeech.voiceTip() ? ' warn' : ''); }
}
function speak(text) {
  if (!soundOn || !('speechSynthesis' in window) || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(TWSpeech.text(text, { zhuyin: 'read' }));
  u.lang = TWSpeech.langOf(zhVoice); u.rate = rate; u.pitch = 1.08; if (zhVoice) try { u.voice = zhVoice; } catch {}
  speechSynthesis.speak(u);
}
function chime(freqs, dur = .12, vol = .12) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    freqs.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i * dur); g.gain.linearRampToValueAtTime(vol, t + i * dur + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + i * dur + dur * 1.8);
      o.connect(g).connect(actx.destination); o.start(t + i * dur); o.stop(t + i * dur + dur * 2);
    });
  } catch {}
}

/* ---------- 注音：直式（共用 ../zhuyin-layout.js：符號由上往下，聲調在最後一個符號右上方，輕聲點在最上面） ---------- */
const ZY = ZhuyinLayout;
const TONE_NAME = ZY.TONE_NAME;
const { syl, baseOf } = ZY;
// 選項裡 _ 連起同一個選項的兩個音
const sylsOf = z => z.split(/[ _]/).filter(Boolean);
// 一個詞：音節由上往下（考卷上的詞也是直的）
const word = (z, cls = '') => ZY.word(sylsOf(z).join(' '), { cls });

const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];

/* =================================================================
 * 作答：每一個要作答的地方是一個 unit。第一次錯給提示再試，第二次一起看答案
 * ================================================================= */
let SEC = null;      // 現在這一大題
let U = {};          // id → unit
let KEYS = [];       // 給家長看的答案
function mkUnit(id, o) {
  const u = Object.assign({ id, tries: 0, st: null }, o);

}
const PRAISE = ['答對了，好棒！', '你看得好仔細！', '一次就答對，太厲害了！', `${KID}好認真，答對了！`, '對！你越來越會了！', '好棒，繼續加油！'];
const PRAISE2 = ['答對了！你沒有放棄，好勇敢！', '再想一次就對了，這就是最厲害的學習方法！', '你自己找到答案了，真棒！'];
const TRY = ['差一點點，沒關係，再想一次。', '嗯～再看一次，你可以的！', '不要急，慢慢來。'];

function judge(u, ok, v, el) {

    coach(p + (say ? ' ' + say : ''), 'ok');

  } else {
    u.tries++;

    chime([330, 262], .14, .08);

    } else {

}

/* ---------- 龜龜老師說話 ---------- */

/* ---------- 做題順序引導 ----------
 * 照考試的做法練習：0 念題目 → 1 看例題（沒有例題就想一想）→ 2 照題號一題一題寫（還沒輪到的題目淡淡的，跳題會提醒）→ 3 檢查 → 4 完成
 * 題目的順序就是 SEC.units 的順序（國語從右邊往左、數學從左邊往右，和題號一樣） */
let guideOn = store.get('guide', true);

const curUnit = () => SEC.units.find(u => !u.st);
// 引導的話加注音（國字右邊直排注音，句子裡的注音也直排）

  GD.items.forEach(el => el.classList.add('gi'));
  $$(EX_SEL).forEach(el => el.classList.add('gi'));

}
function guideStep(n, resumed) {
  GD.step = n;

  const sec = SECS.find(x => x.id === SEC.id), info = GUIDE[SEC.id] || {}, hasEx = !!$(EX_SEL);
  g.hidden = false;
  $$('#guide .stps li').forEach((li, i) => { li.classList.toggle('on', i === Math.min(n, 3) && n < 4); li.classList.toggle('done', i < n); });
  document.body.classList.toggle('g-lock', n <= 1);
  document.body.classList.toggle('g-run', n === 2);
  $$('.gex').forEach(el => el.classList.remove('gex'));

  } else if (n === 1) {
    const t = (hasEx ? GUIDE.ex : GUIDE.think) + (info.how || '') + (hasEx && info.ex ? info.ex : '');
    gtext(msg, t); say = t;
    act.innerHTML = `<button type="button" class="go" data-act="gnext">${hasEx ? T('看懂了') : T('知道了')} ➜</button>`;

// 第三步：把現在要做的題目亮起來，寫完的、還沒輪到的淡淡的

function showEl(el, force) {

/* ---------- 提示：比較選錯的和正確的注音，指出哪裡不一樣（不直接說答案） ---------- */
function diffHint(wrong, right) {
  const A = sylsOf(wrong), B = sylsOf(right);
  for (let k = 0; k < Math.max(A.length, B.length); k++) {
    if (A[k] === B[k]) continue;
    const pos = B.length > 1 ? `第${CN_NUM[k]}個音` : '這個音';
    if (!A[k] || !B[k]) return `${pos}再念念看。`;
    const a = ZY.parse(A[k]), b = ZY.parse(B[k]);
    if (a.b.join('') === b.b.join('')) return `${pos}的聲調再聽一次，是${TONE_NAME[a.t]}嗎？`;
    if (a.b.length < b.b.length) return `${pos}好像少了一個符號喔。`;
    if (a.b.length > b.b.length) return `${pos}好像多了一個符號喔。`;
    const i = a.b.findIndex((c, j) => c !== b.b[j]);
    return `${pos}裡的「${a.b[i]}」再念念看，對不對？`;
  }
  return '再念念看。';
}

/* ---------- 數字鍵盤、聲調鍵盤 ---------- */
const PAD = { u: null, val: '', mode: '' };

/* =================================================================

function rZ1() {

// 選擇題答對：把正確的選項標起來、其他鎖住

// 直式句子
function parseSent(s) {
  return s.split(' | ').map(col => col.split(' ').map(tok => {
    let m = tok.match(/^\[(.+)\]$/) || tok.match(/^\((.+)\)$/);
    if (m) { const o = m[1].split('/'); return { k: tok[0] === '[' ? 'split' : 'paren', o: o.map(x => x.replace('*', '')), a: o.findIndex(x => x.includes('*')) }; }
    if (tok === '□') return { k: 'blank' };
    if (/^[。：，]$/.test(tok)) return { k: 'p', c: tok };
    return { k: 's', z: tok };
  }));
}
const punc = c => c === '：' ? '<span class="vpunc colon" aria-hidden="true"></span>' : `<span class="vpunc">${c}</span>`;
function rZ2() {
  return Z2.map((B, bi) => `<div class="paper"><div class="sgrid">${B.items.map((it, ii) => {

          ans: t.a, card: id,

          explain: () => `這裡是 ${t.o[t.a].replace(/_/g, ' ')}。`,

        });

      const btn = v => `<button type="button" class="cho${it.ex && v === t.a ? ' on' : ''}" ${it.ex ? 'disabled' : `data-act="opt" data-u="${cid}" data-v="${v}"`}>${word(t.o[v])}</button>`;
      return t.k === 'split'
        ? `<span class="ch split" id="u-${cid}">${btn(0)}<i class="dl"></i>${btn(1)}</span>`

    judge(u, n === u.ans, n, $(`#u-${u.id} .cis`));
  } else if (a === 'nb') { if (u) openPad(u, 'num'); }
  else if (a === 'tb') { if (u) openPad(u, 'tone'); }
  else if (a === 'key') padKey(t.dataset.k);
  else if (a === 'tone') {
    const v = +t.dataset.t, x = PAD.u; if (!x) return;
    const ok = v === x.ans || (x.alt || []).includes(v); if (ok) x.val = v;
    judge(x, ok, v, $('#u-' + x.id));
    if (x.st) closePad();
  } else if (a === 'padx') closePad();
  else if (a === 'lk') linkTap(t);
  else if (a === 'go') { location.hash = '#/' + t.dataset.to; }
  else if (a === 'home') { if (location.hash.length > 1) location.hash = ''; else route(); }
  else if (a === 'say') {
    speak(t.dataset.say);
    // 第一步聽完題目就往下走
    if (GD.step === 0) { const st = SEC.id; setTimeout(() => { if (GD.step === 0 && SEC && SEC.id === st) guideStep(1); }, Math.min(7000, 1500 + t.dataset.say.length * 260 / rate)); }
  }
  else if (a === 'gnext') guideStep(GD.step + 1);
  else if (a === 'gck') {
    const i = +t.dataset.i; if (GD.checks[i]) return;
    GD.checks[i] = true; t.classList.add('on'); t.querySelector('.bx').textContent = '✓'; chime([660, 880]);
    if (GUIDE.checks.every((_, k) => GD.checks[k])) { guideStep(4); progress(); }
  }
  else if (a === 'guide') { guideOn = t.dataset.v === '1'; store.set('guide', guideOn); renderHome(); speak(guideOn ? '好，每一大題照做題的順序練習。' : '好，可以自己寫。'); }
  else if (a === 'sound') {
    soundOn = !soundOn; store.set('sound', soundOn); $$('[data-act="sound"]').forEach(b => { b.textContent = soundOn ? '🔊' : '🔈'; });
    if (!soundOn && 'speechSynthesis' in window) speechSynthesis.cancel();
  } else if (a === 'vtest') { if (!soundOn) { soundOn = true; store.set('sound', true); } speak(VOICE_SAMPLE); }
  else if (a === 'rate') { rate = +t.dataset.r; store.set('rate', rate); renderVoicePanel(); speak(VOICE_SAMPLE); }
  else if (a === 'reset') {
    if (!confirm('要把這一大題全部擦掉重寫嗎？')) return;
    store.del('st:' + SEC.id); store.del('tot:' + SEC.id); renderSec(SEC.id);
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'voiceSel') { voicePref = e.target.value; store.set('voice', voicePref); zhVoice = TWSpeech.pickVoice(voicePref); speak(VOICE_SAMPLE); }
});
document.addEventListener('keydown', e => {
  if (!PAD.u) return;
  if (PAD.mode === 'num') {
    if (/^[0-9]$/.test(e.key)) padKey(e.key); else if (e.key === 'Backspace') padKey('bk'); else if (e.key === 'Enter') padKey('ok'); else if (e.key === 'Escape') closePad(); else return;
  } else if (PAD.mode === 'tone') {
    if (/^[1-5]$/.test(e.key)) $(`#toneKeys [data-t="${e.key}"]`).click(); else if (e.key === 'Escape') closePad(); else return;
  }
  e.preventDefault();
});

function confetti() {
  const box = $('#confetti'); box.innerHTML = '';
  for (let i = 0; i < 26; i++) {
    const s = document.createElement('span'); s.textContent = pick(['⭐', '🌟', '🎉', '🍃', '🐢', '✨']);
    s.style.left = rnd(100) + 'vw'; s.style.animationDuration = (2 + Math.random() * 2) + 's'; s.style.animationDelay = Math.random() * .6 + 's';
    box.appendChild(s);
  }
  setTimeout(() => { box.innerHTML = ''; }, 5000);
}

renderToneKeys();
route();
</script>
</body>
</html>
